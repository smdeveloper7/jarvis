<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="JARVIS 구성">
<title>JARVIS 구성</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=block" rel="stylesheet">
<link href="diagram.css" rel="stylesheet">
</head>
<body>
<figure>
<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">JARVIS 구성</title>
<desc id="d">사용자는 Paseo 앱에서 JARVIS 와 대화한다. Paseo 안에서 JARVIS 는 Coordinator 에 배정하고 Coordinator 는 Worker 를 띄우며, 보고는 거꾸로 올라온다. JARVIS 는 Notion 할일 DB 에 할 일을 넣고 JARVIS 폴더에 작업, 결정, 점유, 운영 반영 대기를 쓴다. 플러그인 훅은 모든 세션에 걸려 폴더를 보호하고 커밋 문구를 검사한다. JARVIS 보드는 폴더, Notion, Paseo 기록을 읽고 사용자는 브라우저로 본다.</desc>
<defs>
<marker id="hd" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" class="head-down"/></marker>
<marker id="hu" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" class="head-up"/></marker>
<marker id="hr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse"><polygon points="0 0, 9 3.5, 0 7" class="head-read"/></marker>
</defs>
<rect width="1100" height="560" class="ground"/>
<rect x="214" y="44" width="274" height="486" class="zone"/>
<text x="230" y="68" class="zone-t">Paseo: 세션 띄우기, 메시지, 권한 승인</text>
<rect x="24" y="108" width="140" height="80" class="box ext"/>
<text x="94" y="142" class="box-name" text-anchor="middle">사용자</text><text x="94" y="165" class="box-sub" text-anchor="middle">Paseo 앱, PC와 휴대폰</text>
<rect x="236" y="92" width="228" height="80" class="box hub"/>
<text x="350" y="129" class="box-name hub-name" text-anchor="middle">JARVIS</text>
<text x="350" y="151" class="box-sub hub-sub" text-anchor="middle">JARVIS 폴더에서 뜬 세션</text>
<rect x="244" y="236" width="228" height="80" class="box ghost"/>
<rect x="236" y="244" width="228" height="80" class="box "/>
<text x="350" y="281" class="box-name" text-anchor="middle">Coordinator</text>
<text x="350" y="303" class="box-sub" text-anchor="middle">프로젝트마다 하나</text>
<rect x="244" y="388" width="228" height="80" class="box ghost"/>
<rect x="236" y="396" width="228" height="80" class="box "/>
<text x="350" y="433" class="box-name" text-anchor="middle">Worker</text>
<text x="350" y="455" class="box-sub" text-anchor="middle">작업마다, 동시 3개</text>
<path d="M 164,124 H 233" class="flow down" marker-end="url(#hd)"/><text x="199" y="116" class="msg down-t" text-anchor="middle">대화</text>
<path d="M 236,156 H 167" class="flow up" marker-end="url(#hu)"/><text x="199" y="176" class="msg up-t" text-anchor="middle">요약, 질문</text>
<path d="M 320,172 V 241" class="flow down" marker-end="url(#hd)"/><text x="310" y="212" class="msg down-t" text-anchor="end">[배정] W-…</text>
<path d="M 400,244 V 175" class="flow up" marker-end="url(#hu)"/><text x="410" y="204" class="msg up-t">[보고] [질문]</text><text x="410" y="222" class="msg up-t">[승인요청]</text>
<path d="M 320,324 V 393" class="flow down" marker-end="url(#hd)"/><text x="310" y="364" class="msg down-t" text-anchor="end">띄우기, 지시</text>
<path d="M 400,396 V 327" class="flow up" marker-end="url(#hu)"/><text x="410" y="364" class="msg up-t">[완료] [질문]</text>
<rect x="600" y="72" width="220" height="78" class="box ext"/>
<text x="710" y="108" class="box-name" text-anchor="middle">Notion 할일 DB</text>
<text x="710" y="130" class="box-sub" text-anchor="middle">할 일의 원본</text>
<path d="M 464,112 H 597" class="flow up" marker-end="url(#hu)"/><text x="533" y="102" class="read-t" text-anchor="middle">할 일 넣기, 정리</text><text x="533" y="132" class="read-t" text-anchor="middle">notion-todo 스킬</text>
<path d="M 600,259 a 110,11 0 0 1 220,0 v 70 a 110,11 0 0 1 -220,0 Z" class="box db"/>
<path d="M 600,259 a 110,11 0 0 0 220,0" class="tree"/>
<text x="710" y="298" class="box-name" text-anchor="middle">JARVIS 폴더</text>
<text x="710" y="320" class="box-sub" text-anchor="middle">registry, criteria, state/</text>
<path d="M 464,160 H 640 V 245" class="flow up" marker-end="url(#hu)"/><text x="568" y="184" class="read-t" text-anchor="middle">쓰기: 작업, 결정,</text><text x="568" y="202" class="read-t" text-anchor="middle">점유, 운영 반영 대기</text>
<rect x="560" y="372" width="310" height="100" class="zone"/>
<rect x="576" y="384" width="278" height="28" class="chip"/><text x="590" y="403" class="chip-t">폴더 보호: 다른 세션의 Edit, Write 막기</text>
<rect x="576" y="418" width="278" height="28" class="chip"/><text x="590" y="437" class="chip-t">커밋, PR 문구 검사 (git-message)</text>
<text x="576" y="464" class="zone-t">JARVIS 플러그인: 모든 세션에 걸리는 훅</text>
<path d="M 710,384 V 343" class="flow down" marker-end="url(#hd)"/><text x="720" y="368" class="msg down-t">보호</text>
<path d="M 560,422 H 488" class="flow read"/>
<rect x="920" y="190" width="156" height="80" class="box "/>
<text x="998" y="227" class="box-name" text-anchor="middle">JARVIS 보드</text>
<text x="998" y="249" class="box-sub" text-anchor="middle">127.0.0.1:4991</text>
<path d="M 820,111 H 960 V 187" class="flow read" marker-start="url(#hr)" marker-end="url(#hr)"/><text x="890" y="102" class="read-t" text-anchor="middle">할 일 읽기, 완료 체크</text>
<path d="M 820,294 H 960 V 273" class="flow read" marker-end="url(#hr)"/><text x="890" y="314" class="read-t" text-anchor="middle">state/ 읽기</text>
<path d="M 488,500 H 1040 V 273" class="flow read" marker-end="url(#hr)"/><text x="900" y="492" class="read-t" text-anchor="middle">에이전트 기록, 대화 읽기</text>
<path d="M 1040,190 V 22 H 94 V 105" class="flow read" marker-end="url(#hr)"/><text x="760" y="40" class="read-t" text-anchor="middle">브라우저로 보기</text>
</svg>
</figure>
</body>
</html>
