<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS 보드</title>
<meta name="description" content="이 호스트에 떠 있는 Claude Code 와 Codex 세션의 상태, 결정, 메시지를 읽기만 하는 로컬 화면">
<link rel="stylesheet" href="/vendor/xterm.css">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark' } catch (e) {}</script>
<style>
:root {
  color-scheme: dark;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-xs: 0.75rem; --text-meta: 0.8125rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --container: 880px;
  --z-sticky: 200;
  --font-body: 'Wanted Sans Variable', 'Wanted Sans', system-ui, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-outlier: 'JetBrains Mono', 'SF Mono', 'D2Coding', ui-monospace, Monaco, 'Courier New', monospace;
  --radius-card: 10px; --radius-ctl: 8px; --radius-pill: 999px; --rule-hair: 1px;

  /* black: a neutral near-black (chroma 0.002, never #000) that steps up in lightness for side, page, canvas, card and raised */
  --color-side: oklch(11% 0.002 260); --color-paper: oklch(13.5% 0.002 260); --color-canvas: oklch(15.5% 0.002 260);
  --color-paper-2: oklch(18.5% 0.003 260); --color-node: oklch(20% 0.003 260); --color-paper-3: oklch(23.5% 0.004 260);
  --color-ink: oklch(96% 0.002 260); --color-ink-2: oklch(86% 0.003 260); --color-muted: oklch(72% 0.004 260); --color-faint: oklch(64% 0.004 260);
  --color-rule: oklch(27% 0.004 260); --color-rule-2: oklch(38% 0.005 260); --color-dot: oklch(96% 0.002 260 / 0.07);
  --color-hover: oklch(96% 0.002 260 / 0.05);
  /* the one point colour, #E2560B fixed by the user: what waits on you and the selected place, never plain data.
     As text it sits only on page, side and card (4.9 to 5.4:1), never on the raised step (4.4:1) */
  --color-accent: #E2560B; --color-accent-text: #E2560B; --color-accent-ink: oklch(13% 0.01 48);
  --color-select: oklch(96% 0.002 260 / 0.2);
  /* at work is white on black: a filled chip and bright blocks, so state reads without a second hue */
  --color-live: oklch(94% 0.003 260); --color-live-tint: oklch(94% 0.003 260 / 0.12);
  --color-error: oklch(72% 0.15 25); --color-error-tint: oklch(72% 0.15 25 / 0.14); --color-focus: #E2560B;
  /* the session window is a dark terminal in both modes */
  --term-bg: oklch(10.5% 0.002 260); --term-ink: oklch(90% 0.003 260); --term-bold: oklch(97% 0.002 260);
  --term-res: oklch(72% 0.004 260); --term-prm: #E2560B; --term-rule: oklch(96% 0.002 260 / 0.14);
}
:root[data-theme="light"] {
  color-scheme: light;
  /* paper: the same neutral as an off-white page under white cards, the orange deepened so it holds as text */
  --color-side: oklch(94.5% 0.002 260); --color-paper: oklch(97% 0.002 260); --color-canvas: oklch(95% 0.002 260);
  --color-paper-2: oklch(99.7% 0.001 260); --color-node: oklch(99.7% 0.001 260); --color-paper-3: oklch(93.5% 0.003 260);
  --color-ink: oklch(16% 0.003 260); --color-ink-2: oklch(28% 0.004 260); --color-muted: oklch(44% 0.005 260); --color-faint: oklch(50% 0.005 260);
  --color-rule: oklch(89% 0.003 260); --color-rule-2: oklch(78% 0.004 260); --color-dot: oklch(16% 0.003 260 / 0.1);
  --color-hover: oklch(16% 0.003 260 / 0.045);
  /* the same #E2560B for fills, rings, rules and the focus ring (3.1 to 3.7:1, over 3:1); small text takes a deeper cut of it */
  --color-accent: #E2560B; --color-accent-text: oklch(53% 0.16 42); --color-accent-ink: oklch(15% 0.01 45);
  --color-select: oklch(16% 0.003 260 / 0.14);
  --color-live: oklch(16% 0.003 260); --color-live-tint: oklch(16% 0.003 260 / 0.08);
  --color-error: oklch(50% 0.18 25); --color-error-tint: oklch(60% 0.17 25 / 0.12); --color-focus: #E2560B;
}
@font-face {
  font-family: 'Wanted Sans Variable'; font-style: normal; font-weight: 400 1000; font-display: swap;
  src: url('/vendor/WantedSansVariable.woff2') format('woff2');
}

/* base */
*, *::before, *::after { box-sizing: border-box }
html, body { height: 100%; overflow-x: clip }
html { scrollbar-color: var(--color-rule-2) var(--color-paper) }
body {
  margin: 0; display: flex; flex-direction: column; background: var(--color-paper); color: var(--color-ink);
  font: 400 0.9375rem/1.6 var(--font-body); -webkit-font-smoothing: antialiased; caret-color: var(--color-accent);
}
::selection { background: var(--color-select); color: var(--color-ink) }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer }
button:disabled { cursor: not-allowed }
a { color: inherit; text-decoration: none }
h1, h2, h3 { overflow-wrap: break-word; min-width: 0; text-wrap: balance }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: var(--radius-ctl) }
[hidden] { display: none !important }
time, .num, .meta, .chip, .count, .win { font-variant-numeric: tabular-nums }
.mono { font-family: var(--font-outlier); font-size: var(--text-xs) }
.ico { display: inline-block; flex: none; vertical-align: -2px }
noscript p { margin: var(--space-xl) auto; max-width: 48ch; color: var(--color-muted); text-align: center }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important }
}

/* top bar: the wordmark and the live counts; it stays put above the scroll box */
/* the chrome spans the window, its content lines up with the page column */
#top, #usage, #dev, #nav { padding-inline: max(var(--space-md), calc((100% - var(--container)) / 2 + var(--space-md))) }
#top {
  flex: none; display: flex; align-items: center; gap: var(--space-xs); min-height: 56px; background: var(--color-paper)
}
#top h1 { margin: 0; font: 700 var(--text-lg)/1.1 var(--font-body); letter-spacing: -0.02em; white-space: nowrap }
.back, .theme, .notif {
  display: inline-flex; align-items: center; justify-content: center; height: 32px; border-radius: var(--radius-pill);
  color: var(--color-muted); background: var(--color-paper-2);
  transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out)
}
.back:hover, .theme:hover, .notif:hover:not(:disabled) { background: var(--color-hover); color: var(--color-ink) }
.back:active, .theme:active, .notif:active:not(:disabled) { background: var(--color-paper-3) }
.back:hover, .theme:hover, .notif:hover:not(:disabled) { background: var(--color-paper-3) }
.notif { flex: none; gap: var(--space-xs); padding: 0 var(--space-sm); font-size: var(--text-meta); font-weight: 400; white-space: nowrap }
.notif[aria-pressed="true"] { background: var(--color-live); color: var(--color-paper) }
.notif:disabled { opacity: 0.55 }
.back { gap: var(--space-2xs); padding: 0 var(--space-sm) 0 var(--space-xs); font-weight: 600; color: var(--color-ink) }
.theme { width: 32px; flex: none }
@media (max-width: 620px) { .notif { width: 32px; padding: 0 } .notif .lbl { display: none } }
.counts { display: flex; align-items: baseline; gap: var(--space-2xs) var(--space-md); margin-left: auto; margin-right: var(--space-xs); flex-wrap: wrap; justify-content: flex-end }
.count { display: inline-flex; align-items: baseline; gap: var(--space-2xs); color: var(--color-muted); font-size: var(--text-meta); white-space: nowrap }
.count b { font-size: var(--text-md); font-weight: 700; color: var(--color-ink) }
.count.ok b { color: var(--color-live) }
.count.blocked { color: var(--color-accent-text) }
.count.blocked b { color: var(--color-accent-text) }

/* instrument band: a ring and one figure per usage window, the token sum, then dev as a single chip */
#usage, #dev { flex: none; background: var(--color-paper-2); font-size: var(--text-meta); color: var(--color-muted) }
#usage { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-xs) var(--space-lg); padding-block: var(--space-sm) var(--space-xs) }
#usage:empty { display: none }
.use { display: grid; align-content: start; gap: var(--space-2xs); min-width: 0 }
.ul { display: flex; align-items: baseline; gap: var(--space-xs); min-width: 0; font-size: var(--text-xs); font-weight: 700; color: var(--color-ink-2) }
.ul .ago { font-weight: 400; color: var(--color-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.wins { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-md) }
.win { display: inline-flex; align-items: center; gap: var(--space-xs); min-width: 0 }
.wt { display: grid; line-height: 1.2; min-width: 0 }
.wt b { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.02em; color: var(--color-ink) }
.wt .wn { font-size: var(--text-xs); color: var(--color-faint); overflow-wrap: anywhere }
.ring { flex: none; display: block }
.ring .rt { fill: none; stroke: var(--color-paper-3); stroke-width: 4 }
.ring .rv { fill: none; stroke: var(--color-accent); stroke-width: 4; stroke-linecap: round }
.use.stale, .use.missing, .use.broken { opacity: 0.7 }
.use.missing .wn, .use.broken .wn { font-size: var(--text-sm) }
#dev { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs) var(--space-xs); padding-block: var(--space-2xs) var(--space-sm) }
#dev.stale { opacity: 0.7 }
.devl { display: grid; gap: var(--space-2xs); min-width: 0; max-width: 100% }
.devi { display: inline-flex; align-items: center; gap: var(--space-xs); min-width: 0; max-width: 100%; min-height: 28px; padding: 0 var(--space-sm) 0 var(--space-2xs); border-radius: var(--radius-pill); background: var(--color-paper-3); color: var(--color-muted) }
.devi .dk { flex: none; display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-xs); border-radius: var(--radius-pill); background: var(--color-paper-2); font-weight: 700; color: var(--color-ink) }
.devi b { flex: none; font-weight: 600; color: var(--color-ink) }
.devi .dw { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.devi .num { flex: none; color: var(--color-faint) }
.devi.restart { background: var(--color-accent); color: var(--color-accent-ink) }
.devi.restart b, .devi.restart .num, .devi.restart .kd { color: var(--color-accent-ink); font-weight: 700 }
.devi .kd { flex: none; font-weight: 600 }
#dev .more { flex: none; margin: 0 }
#dev .ago { flex: none; color: var(--color-faint) }

/* page tabs: a rail of segments when narrow, the sidebar list when wide */
#nav { flex: none; background: var(--color-paper); padding-block: var(--space-xs) }
#nav .tabs { display: flex; width: max-content; max-width: 100%; margin: 0; padding: var(--space-3xs); gap: var(--space-3xs); border-radius: var(--radius-pill); background: var(--color-paper-2); overflow-x: auto; scrollbar-width: none }
#nav .tab { height: 34px; border-radius: var(--radius-pill); padding: 0 var(--space-sm) }
#nav .tab::after { left: calc(50% - 7px); right: auto; width: 14px; bottom: var(--space-2xs) }
#nav .tab[aria-selected="true"] { background: var(--color-paper-3) }
.tabs { display: flex; gap: var(--space-2xs); margin-top: var(--space-md) }
.tab {
  position: relative; display: inline-flex; flex: none; align-items: center; height: 44px; padding: 0 var(--space-sm);
  font-size: var(--text-sm); color: var(--color-muted); font-weight: 400; white-space: nowrap;
  transition: color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out)
}
.tab::after { content: ''; position: absolute; left: var(--space-xs); right: var(--space-xs); bottom: var(--space-2xs); height: 2px; border-radius: 2px; background: var(--color-accent); transform: scaleX(0); transition: transform var(--dur-short) var(--ease-out) }
/* the one rule left in the chrome: the session tabs sit on a baseline so the feed below reads as their panel */
.dhead .tabs { box-shadow: inset 0 -1px 0 var(--color-rule) }
.dhead .tab::after { bottom: 0 }
.tab:hover:not(:disabled) { color: var(--color-ink) }
.tab:active:not(:disabled) { color: var(--color-ink-2) }
.tab[aria-selected="true"] { color: var(--color-ink); font-weight: 700 }
.tab[aria-selected="true"]::after { transform: scaleX(1) }
.tab:disabled { color: var(--color-faint); opacity: 0.7 }
.tab .num { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; margin-left: var(--space-xs); padding: 0 var(--space-2xs); border-radius: var(--radius-ctl); background: none; color: var(--color-accent-text); font-size: var(--text-xs); font-weight: 800 }
.tab .num.ok { background: none; color: var(--color-ink) }
.tab .num.plain { margin-left: var(--space-2xs); background: none; color: var(--color-muted) }

/* page */
#view { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: var(--container); margin: 0 auto }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: clip; padding: 0 var(--space-md) var(--space-xl) }
.banner { margin: var(--space-md) 0; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-card); background: var(--color-error-tint); color: var(--color-ink) }
.empty { padding: var(--space-xl) var(--space-xs); color: var(--color-faint); text-align: center }
.hint { font-size: var(--text-xs); color: var(--color-faint) }

/* section heads: the name, then its count as a figure */
.sec { margin-top: var(--space-lg) }
.sec-h { display: flex; align-items: baseline; gap: var(--space-xs); width: 100%; padding: 0 0 var(--space-sm); text-align: left }
.sec-h h2 { margin: 0; font: 700 var(--text-md)/1.4 var(--font-body); color: var(--color-ink); letter-spacing: -0.01em }
.sec-h .num { font-size: var(--text-md); font-weight: 700; color: var(--color-faint) }
[data-sec="busy"] .sec-h .num { color: var(--color-live) }
[data-sec="now"] .sec-h .num { color: var(--color-accent-text) }
.sec-h .chev { margin-left: auto; color: var(--color-muted); font-size: var(--text-xs) }
button.sec-h { border-radius: var(--radius-ctl) }
button.sec-h:hover .chev { color: var(--color-ink) }
button.sec-h:active h2 { color: var(--color-ink-2) }
.sec-empty { padding: var(--space-2xs) 0 var(--space-sm); font-size: var(--text-sm); color: var(--color-faint) }

/* status chip: the colour and the word carry the state */
.chip {
  flex: none; display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-xs);
  border-radius: var(--radius-ctl); background: var(--color-paper-3); color: var(--color-muted); font-size: var(--text-xs); font-weight: 700; white-space: nowrap
}
.chip .dot { display: none }
.chip.busy { background: var(--color-live); color: var(--color-paper) }
.chip.blocked { padding: 0; background: none; color: var(--color-accent-text); font-weight: 800 }
.chip.done { background: none; padding: 0; color: var(--color-faint); font-weight: 400 }

/* lane and task badges */
.badge { flex: none; display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-xs); border-radius: var(--radius-ctl); font-size: var(--text-xs); white-space: nowrap }
.badge.lane { background: var(--color-paper-3); color: var(--color-ink-2); font-weight: 600 }
.badge.task { background: var(--color-paper-3); color: var(--color-ink-2); font: 400 var(--text-xs)/20px var(--font-outlier) }
.badge.codex { background: var(--color-paper-3); color: var(--color-muted); font: 600 var(--text-xs)/20px var(--font-outlier) }

/* cards: one hairline well per session; a one-off task is dashed and unfilled, waiting on you is ringed in brass */
.agent {
  position: relative; margin-bottom: var(--space-xs); overflow: hidden;
  border-radius: var(--radius-card); background: var(--color-paper-2)
}
/* state is a surface and a word: waiting on you warms the card, a finished one drops to the page */
/* waiting is the orange chip alone, so a card never carries the orange twice */
.agent.blocked .name { font-weight: 800 }
.agent.done { background: none; opacity: 0.8 }
.agent.done .name { font-weight: 600; color: var(--color-muted) }
.amain { display: block; padding: var(--space-md) var(--space-md) var(--space-sm) }
.amain:hover .name { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; text-decoration-color: var(--color-accent) }
.amain:hover, .amain:active { background: var(--color-hover) }
.amain:focus-visible { outline-offset: -2px; border-radius: var(--radius-card) }
.dec, .todo { padding: var(--space-md) }
.r1 { display: flex; align-items: center; gap: var(--space-xs); min-width: 0 }
.name { flex: 0 1 auto; min-width: 0; font-size: var(--text-md); font-weight: 700; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.r1 .chip { margin-left: auto }
.why { margin-top: var(--space-xs); font-size: var(--text-sm); line-height: 1.6; color: var(--color-muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden }
.agent.blocked .why, .agent.busy .why { color: var(--color-ink) }
.needs { margin-top: var(--space-xs); padding: var(--space-xs) var(--space-sm); border-radius: 0; box-shadow: inset 2px 0 0 var(--color-rule-2); font-size: var(--text-sm); color: var(--color-ink); overflow-wrap: anywhere }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2xs) var(--space-md); margin-top: var(--space-sm); font-size: var(--text-meta); color: var(--color-muted) }
.meta span { white-space: nowrap }
.meta b { font-weight: 600; color: var(--color-ink) }

/* sub-agents: a fold under the card, outside the link */
.subs { background: var(--color-hover) }
.subs-t { display: flex; align-items: center; gap: var(--space-xs); width: 100%; min-height: 40px; padding: var(--space-xs) var(--space-md); text-align: left; font-size: var(--text-meta); color: var(--color-muted) }
button.subs-t:hover { background: var(--color-hover); color: var(--color-ink) }
button.subs-t:active { background: var(--color-paper-3) }
.subs-t b { font-weight: 700; color: var(--color-ink) }
.subs-t .run { color: var(--color-live); font-weight: 600 }
.subs-t .chev { margin-left: auto; color: var(--color-faint); font-size: var(--text-xs) }
.sublist { margin: 0; padding: 0 var(--space-md) var(--space-sm); list-style: none; display: grid; gap: var(--space-2xs) }
.sub { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: var(--space-2xs) var(--space-sm); padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-ctl); background: var(--color-paper) }
.sub .dot { width: 3px; align-self: stretch; border-radius: 2px; background: var(--color-rule-2) }
.sub.busy .dot { background: var(--color-live) }
.sub.idle .dot { background: var(--color-accent) }
.sub .sd { min-width: 0; overflow-wrap: anywhere; font-size: var(--text-sm); color: var(--color-ink) }
.sub .st { font: 400 var(--text-xs)/1.5 var(--font-outlier); color: var(--color-muted); margin-right: var(--space-xs) }
.sub time { font-size: var(--text-xs); color: var(--color-faint); white-space: nowrap }
.sub .sl { grid-column: 2 / 4; font-size: var(--text-xs); color: var(--color-faint) }

/* hero: the sessions at work as one row of cards on top, the office below across the full width */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-md); margin-top: var(--space-md); padding-bottom: var(--space-lg); position: relative }
.hero::after { content: ''; position: absolute; left: var(--space-xl); right: var(--space-xl); bottom: 0; height: 1px; background: var(--color-ink) }   /* the divider, inset from both sides */
.hinfo:empty { display: none }
.hstage { position: relative; aspect-ratio: 1.75 / 1; min-height: 300px; max-height: 700px; overflow: hidden; border-radius: 14px; background: var(--color-side); cursor: grab }
.hstage:active { cursor: grabbing }
.hstage canvas { display: block; width: 100%; height: 100% }
.hlabels { position: absolute; inset: 0; pointer-events: none }
.tag { position: absolute; left: 0; top: 0; max-width: 10em; overflow: hidden; text-overflow: ellipsis; padding: 0 var(--space-xs); border-radius: var(--radius-ctl); background: var(--color-paper-2); color: var(--color-ink); font-size: var(--text-xs); font-weight: 700; line-height: 20px; white-space: nowrap; pointer-events: auto; will-change: transform }
.tag:hover { background: var(--color-paper-3) }
.tag[data-state="rest"] { color: var(--color-muted); font-weight: 600 }
.tag.hub { background: var(--color-ink); color: var(--color-paper) }
.tag.dup { max-width: 15em; box-shadow: inset 0 0 0 1px var(--color-accent) }
.sign { position: absolute; left: 0; top: 0; padding: 0 var(--space-xs); border-radius: var(--radius-ctl); color: var(--color-muted); background: var(--color-paper); font-size: var(--text-xs); font-weight: 600; line-height: 18px; white-space: nowrap; pointer-events: none; will-change: transform; border: 1px solid var(--color-rule) }
.sign.room { color: var(--color-ink); font-weight: 700; border-color: var(--color-rule-2); background: var(--color-paper-2) }
.hinfo { display: grid; gap: var(--space-xs); min-width: 0 }
.hdemo .hsub { margin: 0; font-size: var(--text-meta); color: var(--color-muted) }
.hdemo { display: grid; gap: var(--space-2xs); margin-top: var(--space-sm); padding-top: var(--space-sm); box-shadow: inset 0 1px 0 var(--color-rule) }
.drow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3xs) var(--space-2xs) }
.drow b { min-width: 8em; font-size: var(--text-meta) }
.drow .segb { height: 32px; background: var(--color-paper-2) }
.hero.flat .hstage { display: none }
.hero.flat:has(.hinfo:empty) { display: none }   /* no WebGL: the canvas below carries the sessions */
.slot-hero { container-type: inline-size }
@container (max-width: 640px) {
  .hstage { aspect-ratio: 1.35 / 1; min-height: 260px }
}

/* the session canvas: a dotted field, the hub in the middle, a card per session */
.vhead { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-sm); margin-top: var(--space-lg) }
.vhead h2 { margin: 0; font: 700 var(--text-md)/1.4 var(--font-body) }
.vhead .seg { margin: 0 0 0 auto }
.canvas-wrap { container-type: inline-size }
.canvas {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-areas: "mid mid" "left right"; gap: var(--space-xl) var(--space-2xl); align-items: start;
  margin-top: var(--space-sm); padding: var(--space-lg) var(--space-md); border-radius: var(--radius-card);
  background-color: var(--color-canvas); background-image: radial-gradient(var(--color-dot) 1px, transparent 1.2px); background-size: 16px 16px
}
.canvas.nohub { grid-template-areas: "left right" }
.canvas .links { position: absolute; inset: 0; pointer-events: none; overflow: visible }
.ccol { position: relative; display: grid; gap: var(--space-lg); align-content: start; min-width: 0 }
.ccol.left { grid-area: left } .ccol.right { grid-area: right }
.ccol.mid { grid-area: mid; justify-self: center; width: min(100%, 300px) }
@container (min-width: 760px) {
  .canvas { grid-template-columns: minmax(0, 1fr) minmax(0, 260px) minmax(0, 1fr); grid-template-areas: "left mid right"; column-gap: var(--space-2xl); align-items: center; padding: var(--space-xl) var(--space-lg) }
  .canvas.nohub { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "left right" }
  .ccol.mid { width: 100% }
}
.link { fill: none; stroke: var(--color-rule-2); stroke-width: 1.25; stroke-dasharray: 3 4 }
.link.on { stroke: var(--color-muted); stroke-dasharray: none; stroke-width: 1.5 }
.link.ask { stroke: var(--color-accent); stroke-dasharray: none; stroke-width: 2 }
.lnum { fill: var(--color-muted); font: 700 11px var(--font-body); paint-order: stroke; stroke: var(--color-canvas); stroke-width: 4px; stroke-linejoin: round }
.node {
  position: relative; z-index: 1; display: grid; gap: var(--space-2xs); min-width: 0; padding: var(--space-sm) var(--space-sm) var(--space-md);
  border-radius: var(--radius-card); background: var(--color-node); transition: background-color var(--dur-micro) var(--ease-out)
}
.node:hover { background: var(--color-paper-3) }
.node:active { background: var(--color-hover) }
.node:hover .name { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; text-decoration-color: var(--color-accent) }
.node.blocked .name { font-weight: 800 }
.node.done { background: none; opacity: 0.62 }
.node.hub { padding: var(--space-md) }
.node.hub .name { font-size: var(--text-lg) }
.ntag { position: absolute; left: var(--space-sm); top: calc(-1 * var(--space-md)); max-width: calc(100% - var(--space-lg)); font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.nhead { display: flex; align-items: center; gap: var(--space-xs); min-width: 0 }
.nhead .chip { margin-left: auto }
.ndesc { font-size: var(--text-meta); color: var(--color-muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden }
.node.busy .ndesc, .node.blocked .ndesc, .node.hub .ndesc { color: var(--color-ink) }
.nmeta { display: flex; flex-wrap: wrap; gap: var(--space-3xs) var(--space-sm); font-size: var(--text-xs); color: var(--color-muted) }
.nmeta b { font-weight: 600; color: var(--color-ink) }
.nflag { margin-top: var(--space-2xs); padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-ctl); background: var(--color-paper-3); font-size: var(--text-xs); font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden }
.nflag.ask { padding: 0; background: none; color: var(--color-ink-2); font-weight: 400 }

/* sidebar: wordmark, grouped pages, the usage card at its foot; below 1000px it folds back into the top rows */
.brand, .navg, .page-t { display: none }
@media (max-width: 999px) { #nav.in-detail { display: none } }
@media (min-width: 1000px) {
  body { display: grid; grid-template-columns: 236px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "nav top" "nav dev" "nav view" "use view" }
  #nav { grid-area: nav; padding: var(--space-md) var(--space-sm) var(--space-sm); background: var(--color-side); overflow-y: auto }
  #usage { grid-area: use; grid-template-columns: minmax(0, 1fr); gap: var(--space-xs); padding: 0 var(--space-sm) var(--space-md); background: var(--color-side) }
  #top { grid-area: top } #dev { grid-area: dev; background: var(--color-paper) } #view { grid-area: view; --container: 1100px }
  #top, #dev { padding-inline: max(var(--space-lg), calc((100% - 1100px) / 2 + var(--space-md))) }
  #nav .tabs { flex-direction: column; width: auto; gap: var(--space-3xs); margin: 0; padding: 0; background: none; border-radius: 0 }
  .brand { display: block; padding: var(--space-xs) var(--space-sm) var(--space-md); font: 700 var(--text-md)/1.3 var(--font-body); letter-spacing: -0.02em; border-radius: var(--radius-ctl) }
  .navg { display: block; padding: var(--space-md) var(--space-sm) var(--space-2xs); font-size: var(--text-xs); color: var(--color-faint) }
  #nav .tab { height: 36px; width: 100%; padding: 0 var(--space-sm); border-radius: var(--radius-ctl); font-size: var(--text-sm) }
  #nav .tab::after { left: 0; top: 10px; bottom: 10px; width: 3px; height: auto; margin: 0; border-radius: 2px; transform: scaleY(0) }
  #nav .tab[aria-selected="true"]::after { transform: scaleY(1) }
  #nav .tab:hover:not(:disabled) { background: var(--color-hover) }
  #nav .tab[aria-selected="true"] { background: var(--color-paper-2) }
  #nav .tab .num { margin-left: auto } #nav .tab .num + .num { margin-left: var(--space-2xs) }
  #top h1 .brand-t { display: none } #top h1 .page-t { display: inline }
  .use { padding: var(--space-sm); border-radius: var(--radius-card); background: var(--color-paper-2) }
}

/* detail */
.dhead { flex: none; padding: var(--space-md) var(--space-md) 0 }
.dtitle { display: flex; align-items: center; gap: var(--space-xs); min-width: 0 }
.dtitle h2 { margin: 0; min-width: 0; font: 700 var(--text-xl)/1.25 var(--font-body); letter-spacing: -0.02em }
.dtitle .chip { margin-left: auto }
.dcwd { margin-top: var(--space-2xs); font: var(--text-xs)/1.4 var(--font-outlier); color: var(--color-faint); overflow-wrap: anywhere }
.dhead .why { display: block; -webkit-line-clamp: unset; margin-top: var(--space-xs) }
.cmds { display: flex; flex-direction: column; gap: var(--space-2xs); margin-top: var(--space-sm) }
.cmd { display: flex; align-items: center; gap: var(--space-xs); min-width: 0; padding: var(--space-2xs) var(--space-2xs) var(--space-2xs) var(--space-sm); border-radius: var(--radius-ctl); background: var(--color-paper-2) }
.cmd code { flex: 1; min-width: 0; font: var(--text-xs)/1.4 var(--font-outlier); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cmd button { flex: none; height: 32px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); background: var(--color-accent); color: var(--color-accent-ink); font-size: var(--text-meta); font-weight: 700 }
.cmd button:hover { opacity: 0.9 }
.cmd button:active { opacity: 0.85 }
.dhead .subs { margin-top: var(--space-sm); background: var(--color-paper-2); border-radius: var(--radius-card) }

/* feed */
.note-top { margin: var(--space-md) 0 0; font-size: var(--text-xs); color: var(--color-faint); text-align: center }
.ev { margin-top: var(--space-md) }
.who { display: flex; align-items: baseline; gap: var(--space-xs); font-size: var(--text-xs); color: var(--color-faint); margin-bottom: var(--space-2xs) }
.who b { font-weight: 700; color: var(--color-muted) }
.who time { margin-left: auto }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--text-sm) }
.txt.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 8; overflow: hidden }
.more { display: inline-flex; align-items: center; min-height: 32px; margin-top: var(--space-2xs); font-size: var(--text-xs); color: var(--color-muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--color-rule-2) }
.more:hover { color: var(--color-ink); text-decoration-color: var(--color-accent) }
.more:active { color: var(--color-ink-2) }
.user .txt { padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-card); background: var(--color-paper-3) }
.user .who b { color: var(--color-ink) }
.peer .txt, .send .txt { padding: var(--space-xs) var(--space-sm); background: var(--color-paper-2); border-radius: var(--radius-ctl); font-size: var(--text-meta) }
.peer .who b { color: var(--color-accent-text) }
.send .sum { margin-bottom: var(--space-2xs); font-size: var(--text-meta); font-weight: 600 }
.note { margin-top: var(--space-sm); font-size: var(--text-xs); color: var(--color-faint); text-align: center }
.tool { margin-top: var(--space-2xs) }
.reply + .tool, .user + .tool, .peer + .tool, .send + .tool, .note + .tool { margin-top: var(--space-sm) }
.thead { display: flex; align-items: center; gap: var(--space-xs); width: 100%; min-width: 0; min-height: 32px; padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-ctl); text-align: left; color: var(--color-muted); font-size: var(--text-meta) }
.thead:hover { background: var(--color-hover) }
.thead:active { background: var(--color-paper-3) }
.mark { width: 12px; flex: none; text-align: center; color: var(--color-faint) }
.mark.ok { color: var(--color-live) }
.mark.err { color: var(--color-error) }
.tname { flex: none; font: 400 var(--text-xs)/1.4 var(--font-outlier); color: var(--color-ink) }
.thead .tsum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.thead time { flex: none; color: var(--color-faint); font-size: var(--text-xs) }
.tbody { margin: var(--space-2xs) 0 var(--space-xs) var(--space-lg); display: grid; gap: var(--space-2xs) }
.tbody pre { margin: 0; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-ctl); background: var(--color-paper-2); font: var(--text-xs)/1.5 var(--font-outlier); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; color: var(--color-muted) }
.tbody pre.err { background: var(--color-error-tint); color: var(--color-ink) }

/* session window: a 200-column TUI cannot fit 600px legibly; below 7px the box scrolls sideways, the page never does */
.termwrap { margin-top: var(--space-md); border-radius: var(--radius-card); background: var(--term-bg); padding: var(--space-xs); overflow-x: auto }
.term { overflow: hidden }
.term .xterm-viewport { overflow: hidden !important; background: var(--term-bg) !important }
.termwrap.off { height: 0; margin: 0; padding: 0; border: 0; overflow: hidden; visibility: hidden }
.pane-note { margin: var(--space-xs) 0 0; font-size: var(--text-xs); color: var(--color-faint) }
.seg { display: inline-flex; gap: var(--space-3xs); margin-top: var(--space-md); padding: var(--space-3xs); border-radius: var(--radius-pill); background: var(--color-paper-3) }
.segb { height: 32px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); font-size: var(--text-meta); font-weight: 400; color: var(--color-muted); white-space: nowrap; transition: color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out) }
.segb:hover { color: var(--color-ink) }
.segb:active { background: var(--color-hover) }
.segb[aria-pressed="true"] { background: var(--color-paper); color: var(--color-ink); font-weight: 700 }
.logflow { margin-top: var(--space-sm); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-card); background: var(--term-bg); color: var(--term-ink); font: var(--text-meta)/1.6 var(--font-outlier) }
.ll { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.6em }
.ll.gap { min-height: 0.6em }
.ll.sep { min-height: 0; margin: var(--space-xs) 0; border-top: var(--rule-hair) solid var(--term-rule) }
.ll.bul { margin-top: var(--space-xs); font-weight: 600; color: var(--term-bold) }
.ll.res { color: var(--term-res) }
.ll.prm { color: var(--term-prm) }

/* decisions and todo: a card per item, chips on top, the question or the session name large, prose at a reading measure */
.dcard, .tcard { margin-bottom: var(--space-sm); padding: var(--space-md) var(--space-lg) var(--space-lg); border-radius: var(--radius-card); background: var(--color-paper-2) }
.dcard.waiting { background: none; padding-inline: var(--space-md) }
.dcard.decided { background: none; padding: var(--space-sm) var(--space-md) }
.dchips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs) var(--space-xs) }
.dstate, .dchip { display: inline-flex; align-items: center; gap: var(--space-2xs); height: 24px; padding: 0 var(--space-xs); border-radius: var(--radius-ctl); font-size: var(--text-xs); white-space: nowrap }
.dstate { font-weight: 700 }
.dstate.now { background: var(--color-live); color: var(--color-paper) }
.dstate.live { padding: 0; background: none; color: var(--color-accent-text); font-weight: 800 }
.dstate.waiting { background: var(--color-paper-3); color: var(--color-ink) }
.dstate.decided { padding: 0; color: var(--color-faint); font-weight: 600 }
.dchip { background: var(--color-paper-3); color: var(--color-muted) }
.dchip b { font-weight: 700; color: var(--color-ink) }
.dcard.decided .dchip { background: none; padding: 0 }
.did { margin-left: auto; color: var(--color-faint) }
.dq { margin: var(--space-sm) 0 0; max-width: 40em; font: 700 var(--text-lg)/1.4 var(--font-body); letter-spacing: -0.015em; color: var(--color-ink) }
.dcard.decided .dq { margin-top: var(--space-2xs); font-size: var(--text-md); font-weight: 600; color: var(--color-ink-2) }
.dsrc { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs) var(--space-xs); margin-top: var(--space-xs); font-size: var(--text-meta); color: var(--color-muted) }
.dsrc b { font-weight: 700; color: var(--color-ink-2) }
.dmore { margin-top: var(--space-sm) }
.dmore summary { display: inline-flex; align-items: center; min-height: 32px; font-size: var(--text-meta); font-weight: 600; color: var(--color-muted); cursor: pointer; border-radius: var(--radius-ctl) }
.dmore summary:hover { color: var(--color-ink) }
.dmore summary::-webkit-details-marker { display: none }
.dmore[open] summary::after { content: '접기'; margin-left: var(--space-xs); font-weight: 400; color: var(--color-faint) }
.dmore:not([open]) summary::after { content: '펼치기'; margin-left: var(--space-xs); font-weight: 400; color: var(--color-faint) }
.dtext { margin: var(--space-2xs) 0 0; max-width: 65ch; font-size: 0.9375rem; line-height: 1.75; color: var(--color-ink-2); white-space: pre-wrap; overflow-wrap: anywhere }
.opts { display: grid; gap: var(--space-xs); max-width: 65ch; margin: var(--space-md) 0 0; padding: 0; list-style: none; counter-reset: opt }
.opts li { counter-increment: opt; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--space-sm); align-items: baseline; font-size: 0.9375rem; line-height: 1.6 }
.opts li::before { content: counter(opt); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-ctl); background: var(--color-paper-3); font-size: var(--text-xs); font-weight: 700; line-height: 1; color: var(--color-ink); transform: translateY(-1px) }
.decision { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-sm); max-width: 65ch; margin-top: var(--space-sm); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-ctl); background: var(--color-paper-2); font-size: var(--text-sm); line-height: 1.6; overflow-wrap: anywhere }
.decision b { font-weight: 700; color: var(--color-ink) }
.refs { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-top: var(--space-sm) }
.ref { display: inline-flex; align-items: center; gap: var(--space-xs); max-width: 100%; min-height: 32px; padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-ctl); background: var(--color-paper-3); font: var(--text-xs)/1.5 var(--font-outlier); color: var(--color-muted); text-align: left; overflow-wrap: anywhere }
.ref:hover { color: var(--color-ink) }
.ref:active { background: var(--color-hover) }
.ref .ic { flex: none; color: var(--color-faint); font-family: var(--font-body) }
.golink { display: inline-flex; align-items: center; min-height: 32px; margin-top: var(--space-sm); color: var(--color-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--color-rule-2) }
.golink:hover { text-decoration-color: var(--color-ink) }

.todo-page .mdhead { padding-bottom: var(--space-sm) }
.tcard.closed { opacity: 0.62 }
.tcard .r1 .name { font-size: var(--text-lg) }
.tcard a.name:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; text-decoration-color: var(--color-accent) }
.tcard .dchips { margin-top: var(--space-xs) }
.tlist { margin-top: var(--space-md); display: grid; gap: var(--space-3xs) }
.ti summary, .ti .tsum { display: flex; align-items: flex-start; gap: var(--space-sm); padding: var(--space-xs); border-radius: var(--radius-ctl); list-style: none }
.ti summary { cursor: pointer }
.ti summary::-webkit-details-marker { display: none }
.ti summary:hover { background: var(--color-hover) }
.ti summary:active { background: var(--color-paper-3) }
.tmark { flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; margin-top: var(--space-2xs); border-radius: 99px; box-shadow: inset 0 0 0 1.5px var(--color-muted); color: var(--color-paper) }
.ti.in_progress .tmark { background: var(--color-live); box-shadow: inset 0 0 0 1.5px var(--color-live), inset 0 0 0 4px var(--color-paper-2) }
.ti.completed .tmark { background: var(--color-rule-2); box-shadow: none }
.tmark .ico { width: 11px; height: 11px }
.tsub { flex: 1; display: grid; gap: var(--space-3xs); min-width: 0; max-width: 65ch; font-size: 0.9375rem; line-height: 1.55; overflow-wrap: anywhere }
.ti.in_progress .tsj { font-weight: 700 }
.ti.completed .tsj { color: var(--color-faint); text-decoration: line-through; text-decoration-color: var(--color-rule-2) }
.tact { font-size: var(--text-meta); color: var(--color-ink-2) }
.tid { flex: none; margin-top: var(--space-2xs); color: var(--color-faint) }
.tnote { display: grid; gap: var(--space-2xs); padding: 0 var(--space-xs) var(--space-sm) var(--space-2xl); font-size: var(--text-meta); color: var(--color-muted) }
.tnote .dtext { margin: 0 }
.tnote b { font-weight: 600; color: var(--color-ink) }
.tfold { justify-self: start; margin: var(--space-2xs) 0 0 var(--space-xs) }

/* status.md */
.mdhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2xs) var(--space-sm); padding: var(--space-md) 0 0; font-size: var(--text-xs); color: var(--color-faint) }
.mdhead b { font-weight: 400; color: var(--color-muted) }
.mdhead .devwhy { flex-basis: 100% }
.md { font-size: var(--text-sm); overflow-wrap: break-word }
.md h1, .md h2, .md h3, .md h4 { margin: var(--space-lg) 0 var(--space-xs); line-height: 1.35; letter-spacing: -0.01em; max-width: none; text-wrap: balance }
.md h1 { font-size: var(--text-xl); font-weight: 700 } .md h2 { font-size: var(--text-lg); font-weight: 700 } .md h3 { font-size: var(--text-md); font-weight: 700 } .md h4 { font-size: var(--text-sm); font-weight: 700 }
.md h2 { margin-top: var(--space-xl) }
.md p { margin: var(--space-xs) 0 }
.md ul, .md ol { margin: var(--space-xs) 0; padding-left: var(--space-lg) }
.md li + li { margin-top: var(--space-3xs) }
.md li > ul, .md li > ol { margin: var(--space-3xs) 0 }
.md code { padding: 1px var(--space-2xs); border-radius: 4px; background: var(--color-paper-3); font: var(--text-xs)/1.5 var(--font-outlier) }
.md pre { margin: var(--space-xs) 0; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-ctl); background: var(--color-paper-2); overflow-x: auto }
.md pre code { padding: 0; background: none }
.md blockquote { margin: var(--space-xs) 0; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-ctl); background: var(--color-paper-2); color: var(--color-muted) }
.md hr { border: 0; border-top: var(--rule-hair) solid var(--color-rule); margin: var(--space-md) 0 }
.md a { color: var(--color-accent-text); text-decoration: underline; text-underline-offset: 3px }
.md strong { font-weight: 700 }
/* wide tables size to their content (cells wrap past 24em) and scroll inside their box, never the page */
.tablewrap { margin: var(--space-xs) 0; overflow-x: auto; border-block: var(--rule-hair) solid var(--color-rule-2) }
.md table { border-collapse: collapse; font-size: var(--text-meta); width: max-content; min-width: 100% }
.md th, .md td { min-width: 4em; max-width: 24em; padding: var(--space-xs) var(--space-sm); text-align: left; vertical-align: top; border-bottom: var(--rule-hair) solid var(--color-rule) }
.md th { font-weight: 600; color: var(--color-muted); white-space: nowrap }
.md tr:last-child td { border-bottom: 0 }

/* flow: the session orbit and the message timeline */
.fhead { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-md); padding: var(--space-md) 0 0 }
.seg.flat { margin: 0 }
.fhead .hint { font-size: var(--text-meta) }
.fhead .vseg { margin-left: auto }
.graph {
  position: relative; margin-top: var(--space-sm); border-radius: var(--radius-card); overflow: hidden; background: var(--color-paper-2)
}
.graph svg { display: block; width: 100%; height: auto; user-select: none; touch-action: pan-y }
.graph.orbit svg { cursor: grab }
.graph.orbit.drag svg { cursor: grabbing }
.oring { fill: none; stroke: var(--color-rule); stroke-width: 1 }
.odisc { fill: var(--color-paper); stroke: none }
.fedge { fill: none; stroke: var(--color-rule-2); stroke-linecap: round }
.farrow { fill: var(--color-rule-2) }
.fe { cursor: pointer }
.fhit { fill: none; stroke: transparent; stroke-width: 14 }
.fe:hover .fedge { stroke: var(--color-muted) } .fe:hover .farrow { fill: var(--color-muted) }
.fe.on .fedge { stroke: var(--color-accent) } .fe.on .farrow { fill: var(--color-accent) }
.fnode { cursor: pointer }
.fnode circle { fill: var(--color-paper-3); stroke: var(--color-muted); stroke-width: 1.5 }
.fnode.busy circle { fill: var(--color-live-tint); stroke: var(--color-live); stroke-width: 2 }
.fnode.blocked circle { fill: var(--color-accent); stroke: var(--color-accent); stroke-width: 2 }
.fnode.done circle, .fnode.closed circle { fill: var(--color-paper); stroke: var(--color-rule-2) }
.fnode.g-task circle { stroke-dasharray: 3 2 }
.fnode.hub circle { stroke: var(--color-ink); stroke-width: 2.5 }
.fnode text { fill: var(--color-ink); font: 700 12.5px var(--font-body); paint-order: stroke; stroke: var(--color-paper-2); stroke-width: 4px; stroke-linejoin: round }
.fnode.done text, .fnode.closed text { fill: var(--color-muted); font-weight: 400 }
.fnode.on circle { stroke: var(--color-accent); stroke-width: 3 }
.fnode:focus-visible circle { stroke: var(--color-focus); stroke-width: 3 }
.fnode text.hover { display: none }
.fnode:hover text.hover, .fnode:focus text.hover { display: inline }
.gnote { padding: 0 var(--space-md) var(--space-sm); font-size: var(--text-xs); color: var(--color-faint) }
.ghelp { position: absolute; right: var(--space-sm); top: var(--space-xs); font-size: var(--text-xs); color: var(--color-faint); pointer-events: none }
.graph .dim { opacity: 0.2 }
.fsel { display: flex; align-items: center; gap: var(--space-xs); margin-top: var(--space-sm); padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-md); border-radius: var(--radius-card); background: var(--color-paper-2); font-size: var(--text-sm) }
.fsel b { font-weight: 700 }
.fsel button { margin-left: auto; height: 32px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); background: var(--color-paper-2); font-size: var(--text-meta); color: var(--color-ink); white-space: nowrap }
.fsel button:hover { background: var(--color-hover) }
.fsel button:active { background: var(--color-paper-3) }
.fmsg { padding: var(--space-sm) var(--space-md); margin-bottom: var(--space-xs); border-radius: var(--radius-card); background: var(--color-paper-2) }
.fmsg .r1 { gap: var(--space-xs); font-size: var(--text-meta); color: var(--color-muted) }
.fmsg .r1 b { font-weight: 700; color: var(--color-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.fmsg .r1 time { margin-left: auto; flex: none; font-size: var(--text-xs); color: var(--color-faint) }
.fmsg .arrow { flex: none; color: var(--color-faint) }
.fsum { margin-top: var(--space-2xs); font-size: var(--text-sm); overflow-wrap: anywhere }
.fmsg .txt { margin-top: var(--space-xs); padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-ctl); background: var(--color-paper); font-size: var(--text-meta) }
.fmsg .more { margin-top: var(--space-2xs) }
/* tokens: 처리 토큰 bars by size, coloured by engine */
.toks { display: grid; gap: var(--space-2xs) }
.tok { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) auto; align-items: center; gap: var(--space-sm); font-size: var(--text-meta) }
.tok .tn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600 }
.tok .tn small { margin-left: var(--space-2xs); font: 400 var(--text-xs) var(--font-outlier); color: var(--color-faint) }
.tok .tb { height: 8px; border-radius: 2px; background: var(--color-paper-3); overflow: hidden }
.tok .tb i { display: block; height: 100%; min-width: 3px; border-radius: 2px; background: var(--color-ink-2); opacity: 0.55 }
.tok.codex .tb i, .tleg .codex::before { background: var(--color-muted); opacity: 0.55 }
.tok b { font-weight: 700; text-align: right }
.tleg { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-md); margin: 0 0 var(--space-sm); font-size: var(--text-xs); color: var(--color-faint) }
.tleg span::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: var(--space-2xs); border-radius: 2px; background: var(--color-ink-2); opacity: 0.55; vertical-align: -1px }
.tleg .def { flex-basis: 100% }
.tleg .def::before { display: none }
.toks + .more { margin-top: var(--space-xs) }
.kb { flex: none; display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-xs); border-radius: var(--radius-ctl); font-size: var(--text-xs); font-weight: 700; background: var(--color-paper-3); color: var(--color-ink) }
.kb.report { background: var(--color-live-tint); color: var(--color-live) }
.kb.notice { padding: 0; background: none; color: var(--color-accent-text); font-weight: 800 }
.kb.other { background: none; padding: 0; color: var(--color-muted); font-weight: 600 }
</style>
</head>
<body>
<header id="top"></header>
<div id="usage" aria-label="남은 사용량"></div>
<div id="dev" aria-label="dev 점유" hidden></div>
<nav id="nav"></nav>
<main id="view"><noscript><p>이 화면은 스크립트로 서버 API 를 읽어 그립니다. 브라우저에서 스크립트를 켜 주세요.</p></noscript></main>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/OrbitControls.js"></script>
<script>
'use strict'
const topBar = document.getElementById('top'), nav = document.getElementById('nav'), view = document.getElementById('view')

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue
    if (k === 'class') el.className = v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else el.setAttribute(k, v === true ? '' : v)
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c)
  return el
}
const put = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter(c => c != null && c !== false))
const NS = 'http://www.w3.org/2000/svg'   // sv(): h() for SVG elements
function sv(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else el.setAttribute(k, v)
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c)
  return el
}

// line icons, drawn instead of arrow and symbol glyphs in the screen text
const ICONS = {
  back: ['M10 3 5 8l5 5'],
  check: ['M3.5 8.5 6.5 11.5 12.5 4.5'],
  ext: ['M7 3H3.5v9.5H13V9', 'M9.5 3H13v3.5', 'M13 3 7.5 8.5'],
  to: ['M2.5 8h10', 'M9 4.5 12.5 8 9 11.5'],
  theme: ['M8 2.5a5.5 5.5 0 1 0 0 11a5.5 5.5 0 1 0 0-11z', 'M8 2.5v11a5.5 5.5 0 0 0 0-11z']
}
const icon = (name, label) => sv('svg', Object.assign({ class: 'ico', width: 14, height: 14, viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' },
  label ? { role: 'img', 'aria-label': label } : { 'aria-hidden': 'true' }), ICONS[name].map((d, i) => sv('path', { d, fill: name === 'theme' && i ? 'currentColor' : null })))

const span = ms => {
  const m = Math.max(0, Math.floor((Date.now() - ms) / 60000))
  if (m < 1) return '방금'
  if (m < 60) return m + '분'
  const hr = Math.floor(m / 60)
  return hr < 24 ? `${hr}시간 ${m % 60}분` : `${Math.floor(hr / 24)}일 ${hr % 24}시간`
}
const ago = ms => ms ? (span(ms) === '방금' ? '방금' : span(ms) + ' 전') : '기록 없음'
const hm = ms => ms ? ' ' + new Date(ms).toTimeString().slice(0, 5) : ''
const home = p => (p || '').replace(/^\/home\/[^/]+/, '~')
const clock = iso => {
  if (!iso) return ''
  const d = new Date(iso), p = n => String(n).padStart(2, '0')
  const t = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
  return d.toDateString() === new Date().toDateString() ? t : `${d.getMonth() + 1}월 ${d.getDate()}일 ${t}`
}

function status(a) {
  if (a.state === 'working' || a.status === 'busy') return { key: 'busy', label: '작업 중' }
  if (a.state === 'blocked') return { key: 'blocked', label: '대기 중' }
  if (a.state === 'done') return { key: 'done', label: '끝남' }
  return { key: 'idle', label: a.kind === 'interactive' || a.engine === 'codex' ? '지시 대기' : '쉬는 중' }
}
const stateEl = s => h('span', { class: 'chip ' + s.key }, h('span', { class: 'dot', 'aria-hidden': 'true' }), s.label)
const kindLabel = a => a.engine === 'codex' ? 'codex ' + (a.source || '') : a.kind === 'background' ? '백그라운드' : '대화형'
// resident sessions carry their lane, one-off task sessions their job id; sessions not in agents.json get neither
const badge = a => a.engine === 'codex' ? h('span', { class: 'badge codex', title: 'Codex 세션' }, 'codex')
  : a.group === 'resident' ? h('span', { class: 'badge lane', title: '상시 세션 레인' }, a.lane || '상시')
  : a.group === 'task' ? h('span', { class: 'badge task', title: '일회성 작업' + (a.lane ? ', ' + a.lane : '') }, a.task || '일회성')
  : null
const SECTIONS = [['busy', '진행 중'], ['wait', '입력 대기'], ['done', '종료']]
let doneOpen = false
try { doneOpen = localStorage.getItem('doneOpen') === '1' } catch (e) {}

let agents = [], error = '', cur = null, page = 'agents'
let officeInfo = { boss: '사장', projects: [], pending: 0 }   // JARVIS: /api/agents 의 office (사장 명패, 프로젝트 방, 결정 대기 수)
const BOSS_SID = 'boss'

async function getJSON(url) {
  const r = await fetch(url)
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status)
  return r.json()
}

/* ---------- header ---------- */
function renderTop() {
  const n = k => agents.filter(a => status(a).key === k).length
  const blocked = n('blocked')
  const themeBtn = h('button', {
    class: 'theme', title: '밝은 화면과 어두운 화면 바꾸기', 'aria-label': '테마 바꾸기',
    onclick() {
      const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
      document.documentElement.dataset.theme = t
      try { localStorage.setItem('theme', t) } catch (e) {}
    }
  }, icon('theme'))
  put(topBar, 
    cur ? h('a', { class: 'back', href: '#/' }, icon('back'), '목록')
      : h('h1', {}, h('span', { class: 'brand-t' }, 'JARVIS 보드'), h('span', { class: 'page-t' }, (PAGES.find(p => p[0] === page) || PAGES[0])[1])),
    h('div', { class: 'counts' },
      blocked ? h('span', { class: 'count blocked' }, '대기 중 ', h('b', { class: 'num' }, blocked)) : null,
      h('span', { class: 'count' + (n('busy') ? ' ok' : '') }, '작업 중 ', h('b', { class: 'num' }, n('busy'))),
      subRun() ? h('span', { class: 'count ok', title: '지금 도는 서브에이전트' }, '서브에이전트 ', h('b', { class: 'num' }, subRun())) : null,
      h('span', { class: 'count' }, '전체 ', h('b', { class: 'num' }, agents.length))),
    notifyBtn(), themeBtn)
  renderTitle()
  nav.classList.toggle('in-detail', !!cur)   // narrow: the tab row hides on a session page; wide: the sidebar stays
  const nNow = dec?.now?.length || 0, tc = todo?.counts || {}
  put(nav, h('a', { class: 'brand', href: '#/' }, 'JARVIS 보드'),
    h('div', { class: 'tabs', role: 'tablist', 'aria-label': '화면' }, PAGES.map(([key, label, href, group], i) => [
      group !== PAGES[i - 1]?.[3] ? h('div', { class: 'navg', 'aria-hidden': 'true' }, group) : null,
      h('button', { class: 'tab', role: 'tab', 'aria-selected': String(!cur && page === key), onclick: () => { location.hash = href } },
        label, key === 'decisions' && nNow ? h('span', { class: 'num', title: '지금 결정 필요' }, nNow) : null,
        key === 'todo' ? [tc.in_progress ? h('span', { class: 'num ok', title: '진행 중인 할 일' }, tc.in_progress) : null,
          tc.pending ? h('span', { class: 'num plain', title: '대기 중인 할 일' }, tc.pending) : null] : null)])))
}
const subRun = () => agents.reduce((n, a) => n + (a.subagents || []).filter(s => s.state === 'busy').length, 0)
// [key, label, hash, sidebar group]; the narrow tab row keeps the same order without the group names
const PAGES = [['agents', '에이전트', '#/', '세션'], ['flow', '흐름', '#/flow', '세션'], ['decisions', '결정', '#/decisions', '할 것'], ['todo', '할 일', '#/todo', '할 것'], ['status', '현황', '#/status', 'JARVIS']]

/* ---------- alerts: tab title count and browser notifications ---------- */
// reports to the hub newer than reportMark are new; unread ones count in the title until the page is seen
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
}
let reportMark = store.get('reportMark', null), notifyOn = store.get('notify', false)
const unread = new Set()
const canNotify = () => 'Notification' in window && Notification.permission === 'granted' && notifyOn
function renderTitle() {
  const n = agents.filter(a => status(a).key === 'blocked').length + unread.size
  document.title = (n ? `(${n}) ` : '') + 'JARVIS 보드'
}
function seen() {
  if (document.visibilityState === 'visible' && unread.size) { unread.clear(); renderTitle() }
}
// remembered across reloads and tabs, so one event is announced once
function firstTime(key) {
  const done = store.get('notified', [])
  if (done.includes(key)) return false
  store.set('notified', [...done, key].slice(-300))
  return true
}
function forget(keys) {
  const done = store.get('notified', [])
  if (done.some(k => keys.includes(k))) store.set('notified', done.filter(k => !keys.includes(k)))
}
function notify(title, body, tag, hash) {
  try {
    const n = new Notification(title, { body: (body || '').slice(0, 300), tag })
    n.onclick = () => { window.focus(); location.hash = hash; n.close() }
  } catch (e) {}
}
// a session that turns blocked is announced once; once it moves on, the next block is new again
function checkBlocked() {
  const blocked = agents.filter(a => status(a).key === 'blocked')
  const keys = blocked.map(a => 'b:' + a.sessionId)
  forget(store.get('notified', []).filter(k => k.startsWith('b:') && !keys.includes(k)))
  if (!canNotify()) return
  for (const a of blocked) if (firstTime('b:' + a.sessionId)) notify(`${a.name || a.sessionId.slice(0, 8)} 대기 중`, a.needs || a.detail, 'b:' + a.sessionId, '#/s/' + a.sessionId)
}
function checkReports(d) {
  const reports = (d.messages || []).filter(m => m.kind === 'report' && m.to === d.hub && m.t)
  const top = Math.max(0, ...reports.map(m => m.t))
  if (reportMark == null) { reportMark = top || Date.now(); store.set('reportMark', reportMark); return }   // history is not news
  const fresh = reports.filter(m => m.t > reportMark).reverse()
  if (!fresh.length) return
  fresh.forEach(m => unread.add(m.id))
  reportMark = top; store.set('reportMark', reportMark)
  const news = canNotify() ? fresh.filter(m => firstTime('r:' + m.id)) : []
  if (news.length > 3) notify(`${d.hub} 에게 보고 ${news.length}건`, news.map(m => `${m.from}: ${m.sum}`).join('\n'), 'reports', '#/flow')
  else news.forEach(m => notify(`${m.from} 보고`, m.sum, 'r:' + m.id, '#/flow'))
  renderTitle(); seen()
}
// the label hides below 620 px and the bell stays (title and aria-label carry the words)
const bell = () => sv('svg', { width: 15, height: 15, viewBox: '0 0 16 16', 'aria-hidden': 'true', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-linejoin': 'round' },
  sv('path', { d: 'M4 11.5V7a4 4 0 0 1 8 0v4.5l1.2 1.3H2.8z' }), sv('path', { d: 'M6.5 14.2a1.6 1.6 0 0 0 3 0' }))
function notifyBtn() {
  const btn = (attrs, label) => h('button', Object.assign({ class: 'notif', 'aria-label': label }, attrs), bell(), h('span', { class: 'lbl' }, label))
  if (!('Notification' in window)) return btn({ disabled: true, title: '이 브라우저는 알림을 지원하지 않습니다' }, '알림 없음')
  if (Notification.permission === 'denied') return btn({ disabled: true, title: '브라우저 설정에서 이 주소의 알림을 허용해야 켤 수 있습니다' }, '알림 막힘')
  const on = canNotify()
  return btn({
    'aria-pressed': String(on),
    title: on ? '켜져 있음: 세션이 대기 중이 되거나 허브에게 보고가 오면 알립니다. 누르면 끕니다.'
      : '세션이 대기 중이 되거나 허브에게 보고가 오면 브라우저 알림으로 알립니다',
    async onclick() {
      if (on) notifyOn = false
      else {
        if (Notification.permission === 'default') await Notification.requestPermission()
        notifyOn = Notification.permission === 'granted'
        // what is blocked right now is the starting point; only changes from here are announced
        if (notifyOn) agents.filter(a => status(a).key === 'blocked').forEach(a => firstTime('b:' + a.sessionId))
      }
      store.set('notify', notifyOn); renderTop()
    }
  }, on ? '알림 켬' : '알림 켜기')
}

/* ---------- tokens ---------- */
// 792000 -> 79.2만, 115753467 -> 1.2억 (one decimal below 100 of the unit)
const tok = n => {
  if (n >= 1e8) return +(n / 1e8).toFixed(n < 1e10 ? 1 : 0) + '억'
  if (n >= 1e4) return +(n / 1e4).toFixed(n < 1e6 ? 1 : 0) + '만'
  return n.toLocaleString()
}
// 처리 토큰 = input (cache writes in, cache reads out) + output; cache reads only show in the tooltip
const ENGINE = { claude: 'Claude', codex: 'codex' }
const TOK_DEF = '처리 토큰 = 입력(캐시 쓰기 포함, 캐시 읽기 제외) + 출력'
function tokTip(t) {
  const n = x => (x || 0).toLocaleString()
  const read = `. 합에 넣지 않은 캐시 읽기 ${n(t.cacheRead)}`
  if (t.engine === 'codex') return `처리 토큰 ${n(t.total)}: 입력 ${n(t.input)}(캐시 제외), 출력 ${n(t.output)}(그중 추론 ${n(t.reasoning)})` + read
  return `처리 토큰 ${n(t.total)}: 입력 ${n(t.input)}, 캐시 쓰기 ${n(t.cacheWrite)}, 출력 ${n(t.output)}` + read
    + (t.subagents ? `. 서브에이전트 기록 ${t.subagents}개 포함` : '')
}
const withTokens = () => agents.filter(a => a.tokens).sort((a, b) => b.tokens.total - a.tokens.total)

/* ---------- list ---------- */
const SUB_STATE = { busy: '작업 중', done: '끝남', idle: '응답 없음' }
const openSubs = new Set()
try { JSON.parse(localStorage.getItem('openSubs') || '[]').forEach(x => openSubs.add(x)) } catch (e) {}
const saveSubs = () => { try { localStorage.setItem('openSubs', JSON.stringify([...openSubs])) } catch (e) {} }

function subItem(s) {
  return h('li', { class: 'sub ' + s.state },
    h('span', { class: 'dot', 'aria-hidden': 'true' }),

/* office: the sessions as low-poly figures in an isometric room (three.js r128, vendored).
   The hub sits at its own desk; a session at work sits at its desk with a typing bubble and a lit screen, a waiting
   one shows an orange "!" and a blinking screen, one at rest or finished sits in the lounge. A new [배정] from the hub
   flies a sheet from the hub to that desk, a [보고] flies one back. Drag turns the room. It pauses on hover or focus;
   under reduced motion nothing walks or flies; without WebGL the list beside it stays. #/demo adds buttons that
   override a session's scene locally, for trying the scenes; nothing is sent anywhere. */
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches
const demoOn = () => location.hash === '#/demo'
const sceneOverride = new Map()   // #/demo only: sessionId -> 'working' | 'waiting' | 'rest'
const sceneOf = a => sceneOverride.get(a.sessionId) || { busy: 'working', blocked: 'waiting' }[status(a).key] || 'rest'
const SCENE_LABEL = { working: '작업 중', waiting: '대기 중', rest: '쉬는 중' }
let hero = null

function heroBox() {
  if (hero) return hero.box
  const labels = h('div', { class: 'hlabels' })
  const stage = h('div', { class: 'hstage' }, labels)
  const info = h('div', { class: 'hinfo' })
  const box = h('section', { class: 'hero', 'aria-label': '세션 오피스' }, stage, info)
  hero = { box, stage, labels, info, ok: false, figs: new Map(), raf: 0, paused: false, last: 0, mark: null, o: null }
  const hold = v => () => { hero.paused = v; heroLoop() }
  box.addEventListener('mouseenter', hold(true)); box.addEventListener('mouseleave', hold(false))
  box.addEventListener('focusin', hold(true)); box.addEventListener('focusout', hold(false))
  try { officeInit(); hero.ok = true } catch (e) { box.classList.add('flat') }   // no THREE or no WebGL: the list alone
  return box
}

function officeInit() {
  if (typeof THREE === 'undefined' || !THREE.OrbitControls) throw new Error('three.js not loaded')
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2))
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap
  hero.stage.prepend(renderer.domElement)
  const scene = new THREE.Scene()
  const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 200)
  camera.position.set(16, 15, 16); camera.lookAt(0, 0, 0)
  const controls = new THREE.OrbitControls(camera, renderer.domElement)
  Object.assign(controls, { enableDamping: !calm(), enablePan: false, enableZoom: false, minPolarAngle: Math.PI * 0.12, maxPolarAngle: Math.PI * 0.42 })
  controls.addEventListener('change', () => { if (!hero.raf) officeRender() })
  controls.addEventListener('end', () => officeResize())
  const hemi = new THREE.HemisphereLight(0xffffff, 0x808080, 0.7); scene.add(hemi)
  const sun = new THREE.DirectionalLight(0xffffff, 0.7)
  sun.position.set(-6, 16, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006
  scene.add(sun, sun.target)
  const std = () => new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85, metalness: 0 })
  const M = { floor: std(), wall: std(), rug: std(), desk: std(), leg: std(), sofa: std(), seat: std(), hubSeat: std(), plant: std(), pot: std(), bean: std(), body: std(), skull: std(), hubTile: std(), room: std(), booth: std(),
    dark: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.55 }) }
  hero.o = { renderer, scene, camera, controls, hemi, sun, M, room: null, rows: -1, desks: [], hub: null, lounge: [], packets: [], tex: {}, v: new THREE.Vector3(), down: null }
  officeColors()
  new MutationObserver(() => { officeColors(); officeRender() }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] })
  new ResizeObserver(officeResize).observe(hero.stage)
  // a click (not a drag) on a figure or its desk opens that session
  const el = renderer.domElement, ray = new THREE.Raycaster(), ptr = new THREE.Vector2()
  el.addEventListener('pointerdown', e => { hero.o.down = [e.clientX, e.clientY] })
  el.addEventListener('pointerup', e => {
    const d = hero.o.down; hero.o.down = null
    if (!d || Math.hypot(e.clientX - d[0], e.clientY - d[1]) > 5) return
    const r = el.getBoundingClientRect()
    ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1)
    ray.setFromCamera(ptr, camera)
    const hit = ray.intersectObjects([...hero.figs.values()].map(f => f.g), true)[0]
    if (hit) { let o = hit.object; while (o && !o.userData.sid) o = o.parent; if (o) location.hash = o.userData.sid === BOSS_SID ? '#/decisions' : '#/s/' + o.userData.sid }
  })
}

function officeColors() {
  const o = hero.o, c = k => new THREE.Color(tokenRGB(k)), light = document.documentElement.dataset.theme === 'light'
  const set = { floor: light ? '--color-paper-3' : '--color-paper-3', wall: light ? '--color-side' : '--color-paper-2', rug: '--color-paper-3', desk: light ? '--color-paper' : '--color-rule-2', leg: '--color-rule',
    sofa: light ? '--color-rule-2' : '--color-paper-3', seat: '--color-rule-2', hubSeat: '--color-accent', plant: '--color-muted', pot: '--color-rule-2', bean: '--color-accent',
    body: light ? '--color-rule-2' : '--color-muted', skull: light ? '--color-paper-2' : '--color-ink', hubTile: '--color-paper-3', dark: light ? '--color-ink-2' : '--color-side',
    room: light ? '--color-paper-2' : '--color-rule', booth: light ? '--color-rule' : '--color-paper-2' }
  for (const [k, v] of Object.entries(set)) o.M[k].color.copy(c(v))

function officeTextures() {
  const o = hero.o, col = o.col, font = getComputedStyle(document.body).fontFamily
  for (const t of Object.values(o.tex).flat()) t?.dispose?.()
  const tex = draw => { const c = document.createElement('canvas'); c.width = c.height = 128; draw(c.getContext('2d')); return new THREE.CanvasTexture(c) }
  const pill = (x, X, Y, W, H, R) => { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath() }
  o.tex.zzz = tex(x => { x.fillStyle = col.rest; [['z', 34, 98, 30], ['z', 62, 70, 38], ['Z', 88, 40, 46]].forEach(([s, X, Y, size]) => { x.font = `800 ${size}px ${font}`; x.fillText(s, X, Y) }) })
  o.tex.bang = tex(x => {
    x.fillStyle = col.waiting; x.beginPath(); x.arc(64, 60, 40, 0, Math.PI * 2); x.fill()
    x.beginPath(); x.moveTo(54, 96); x.lineTo(64, 118); x.lineTo(74, 96); x.fill()
    x.fillStyle = col.side; x.font = `900 60px ${font}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('!', 64, 62)
  })
  o.tex.dots = [0, 1, 2].map(i => tex(x => {
    x.fillStyle = col.ink; pill(x, 14, 30, 100, 56, 22); x.fill()
    x.beginPath(); x.moveTo(52, 86); x.lineTo(60, 104); x.lineTo(70, 86); x.fill()
    ;[0, 1, 2].forEach(k => { x.fillStyle = k === i ? col.side : col.rest; x.beginPath(); x.arc(42 + k * 22, 58, 8, 0, Math.PI * 2); x.fill() })

// JARVIS: 왼쪽에 사장실(유리벽)과 그 문 앞 비서 자리(JARVIS), 오른쪽에 프로젝트 방. 방마다 입구 쪽 칸막이 안이
// Coordinator 자리, 칸막이 너머가 Worker 작업 공간(책상 6개까지). 방이 늘면 아래로 이어지고 라운지와 카메라가 따라간다.
const ROOM = { d: 5.0, gap: 0.7, x0: -2.6, x1: 11, booth: 1.2, corridorX: -3.7 }
function officeLayout(projects) {
  const o = hero.o, key = projects.map(p => p.key + ':' + p.name).join('|') || '-'
  if (key === o.layoutKey) return false

  const g = new THREE.Group(); o.scene.add(g); o.room = g; o.layoutKey = key
  const box = (w, hh, d, mat, x, y, z, parent = g, shadow = true) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m
  }
  const plane = (w, d, mat, x, z, y = 0.006) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; g.add(m); return m }
  const font = getComputedStyle(document.body).fontFamily
  for (const el of o.signs || []) el.el.remove()
  o.signs = []
  const floorText = (text, x, z, w, size, cls = '') => {   // 방·구역 표지판: 바닥 지점 위에 뜨는 글씨

  const n = Math.max(1, projects.length), step = ROOM.d + ROOM.gap
  const roomsEnd = -7.6 + n * step - ROOM.gap
  const loungeZ = Math.max(roomsEnd, 2.4) + 2.6, front = loungeZ + 4.5, depth = front + 7.6, cz = (front - 7.6) / 2
  o.geo = { loungeZ, entry: loungeZ + 0.9, cz, depth }
  plane(22, depth, o.M.floor, 0, cz, 0)
  box(22, 2.4, 0.2, o.M.wall, 0, 1.2, -7.6, g, false)
  box(0.2, 2.4, depth + 0.2, o.M.wall, -11.1, 1.2, cz, g, false)
  const plant = (x, z) => {

    const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(0.48, 0), o.M.plant); leaves.position.set(x, 0.9, z); leaves.castShadow = true; g.add(leaves)
  }
  plant(-10.3, front - 0.9); plant(10.2, front - 0.9); plant(-4.4, 2.6)
  const desk = (x, z, wide, seatMat) => {
    const d = new THREE.Group(); d.position.set(x, 0, z); g.add(d)
    const w = wide ? 2.6 : 1.7
    box(w, 0.08, 0.9, o.M.desk, 0, 0.76, 0, d)
    ;[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => box(0.06, 0.72, 0.06, o.M.leg, sx * (w / 2 - 0.08), 0.36, sz * 0.36, d))
    const screens = (wide ? [-0.58, 0.58] : [0]).map(mx => {

      const sm = new THREE.MeshStandardMaterial({ color: 0x141414, emissive: 0x000000, roughness: 0.35 })

    box(0.56, 0.08, 0.52, sm, 0, 0.46, 0.86, d); box(0.56, 0.52, 0.08, sm, 0, 0.76, 1.12, d); box(0.07, 0.42, 0.07, o.M.dark, 0, 0.21, 0.86, d)

  if (!o.M.glass) o.M.glass = new THREE.MeshStandardMaterial({ color: 0xbfd6e6, transparent: true, opacity: 0.22, roughness: 0.1 })
  plane(6.3, 5.4, o.M.booth, -7.95, -4.9)
  box(0.08, 1.7, 5.4, o.M.glass, -4.8, 0.85, -4.9, g, false)
  box(2.6, 1.7, 0.08, o.M.glass, -9.8, 0.85, -2.2, g, false); box(1.6, 1.7, 0.08, o.M.glass, -5.6, 0.85, -2.2, g, false)
  o.bossDesk = desk(-7.95, -5.7, true, o.M.dark)
  if (!o.lampMat) o.lampMat = new THREE.MeshStandardMaterial({ color: 0x777777, emissive: 0x000000, roughness: 0.4 })
  box(0.06, 0.34, 0.06, o.M.dark, -6.85, 0.97, -5.95)
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 8), o.lampMat); lamp.position.set(-6.85, 1.2, -5.95); g.add(lamp)
  o.bossAnchor = new THREE.Vector3(o.bossDesk.seat.x, 1.5, o.bossDesk.seat.z)
  floorText('사장실', -10.2, -2.7)
  // 비서 자리(JARVIS): 사장실 문 앞
  plane(4.2, 3.4, o.M.hubTile, -7.95, 0.8)
  o.hubDesk = desk(-7.95, 0.4, true)
  o.hubAnchor = new THREE.Vector3(o.hubDesk.seat.x, 1.5, o.hubDesk.seat.z)
  floorText('비서', -10.3, 1.9)
  // 프로젝트 방

  projects.forEach((p, i) => {
    const z0 = -7.6 + i * step, z1 = z0 + ROOM.d, zc = (z0 + z1) / 2, door = z1 - 0.9, walk = z1 - 0.38

    box(0.12, 1.05, ROOM.d - 1.5, o.M.wall, ROOM.booth, 0.52, z0 + (ROOM.d - 1.5) / 2)       // 칸막이: Coordinator | Worker
    floorText(p.name, ROOM.x1 - 1.4, z1 + 0.35, 0, 0, 'room')
    if (i === 0) { floorText('Coordinator', (ROOM.x0 + ROOM.booth) / 2, z1 + 0.35); floorText('Workers', (ROOM.booth + ROOM.x1) / 2 - 1.2, z1 + 0.35) }   // 구역 표지판: 첫 방 앞벽 바깥(사람·이름표와 겹치지 않게)
    const out = seat => [[seat.x, walk], [ROOM.x0 + 0.5, walk], [ROOM.x0 + 0.5, door], [ROOM.corridorX, door]]
    const room = { key: p.key, name: p.name, coords: [], workers: [] }
    for (const dz of [1.35, 3.1]) {   // 칸막이 안 책상 둘: 둘째는 같은 프로젝트에 Coordinator 가 또 생겼을 때만 쓴다(규칙 위반 표시)

      const wd = desk(x, z0 + dz, false); wd.room = i; wd.kind = 'worker'; wd.out = out(wd.seat); o.desks.push(wd); room.workers.push(o.desks.length - 1)

  box(0.22, 0.58, 0.9, o.M.sofa, 4.0, 0.29, loungeZ); box(0.22, 0.58, 0.9, o.M.sofa, 7.2, 0.29, loungeZ)
  box(1.6, 0.06, 0.7, o.M.desk, 5.6, 0.42, loungeZ + 1.6)
  const beans = [[3.6, loungeZ + 2.5], [7.7, loungeZ + 2.5], [8.7, loungeZ + 1.1]]
  beans.forEach(([x, z]) => { const b = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 8), o.M.bean); b.scale.set(1, 0.5, 1); b.position.set(x, 0.2, z); b.castShadow = b.receiveShadow = true; g.add(b) })
  const seats = [{ x: 4.8, z: loungeZ + 0.1, y: 0.2, rot: 0 }, { x: 5.6, z: loungeZ + 0.1, y: 0.2, rot: 0 }, { x: 6.4, z: loungeZ + 0.1, y: 0.2, rot: 0 },

  o.sun.position.set(-6, 16, cz + 10); o.sun.target.position.set(0, 0, cz)

function officeResize() {
  const o = hero.o, w = hero.stage.clientWidth, hh = hero.stage.clientHeight
  if (!o || !w || !hh || !o.geo) return
  o.renderer.setSize(w, hh, false)
  // every corner of the room box (walls, plants, the top of a flying sheet) as the camera sees it now, plus a margin;
  // it runs again when a drag ends, so a turned room is framed again
  const front = o.geo.cz + o.geo.depth / 2, pts = []
  for (const x of [-11.3, 11.1]) for (const y of [0, 3.6]) for (const z of [-7.8, front + 0.2]) pts.push(new THREE.Vector3(x, y, z))
  o.camera.updateMatrixWorld()
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity
  for (const p of pts) { const q = p.clone().applyMatrix4(o.camera.matrixWorldInverse); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y) }

  const asp = w / hh, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2
  let hw = (x1 - x0) / 2, hy = (y1 - y0) / 2

  hw *= 1.04; hy *= 1.04

// JARVIS: 사장은 사장실, JARVIS 는 비서 자리, Coordinator 는 자기 프로젝트 방의 칸막이 안 책상(늘 그 자리),

function seatAt(f, desk) { f.g.position.set(desk.seat.x, 0.18, desk.seat.z); f.g.rotation.y = Math.PI; f.path = []; f.rest = { y: 0.18, rot: Math.PI } }

const shortTask = t => (t || '').replace(/^W-\d{8}-/, 'W-')   // 방 안 이름표: W-20261106-02-B -> W-02-B
function officeSync() {
  const o = hero.o, hubA = agents.find(a => a.lane === 'HUB')
  const projects = (officeInfo.projects || []).length ? officeInfo.projects : [{ key: '', name: '프로젝트' }]
  const grew = officeLayout(projects)
  for (const [sid, f] of hero.figs) if (sid !== BOSS_SID && !agents.some(a => a.sessionId === sid)) { dropFigure(f); hero.figs.delete(sid) }
  if (grew) for (const f of hero.figs.values()) { f.desk = -1; if (f.spot) { f.spot.taken = null; f.spot = null } f.state = null; f.placed = false }
  let b = hero.figs.get(BOSS_SID)
  if (!b) { b = makeFigure(BOSS_SID, false); b.boss = true; b.tag.href = '#/decisions'; b.tag.classList.add('hub'); hero.figs.set(BOSS_SID, b) }
  if (!b.placed) { seatAt(b, o.bossDesk); b.placed = true }
  b.loc = 'hub'; nameTag(b, officeInfo.boss || '사장')
  b.state = officeInfo.pending > 0 ? 'waiting' : 'idle'   // 결정 대기가 있으면 사장 머리 위에 ! 와 책상 램프
  o.lampMat.emissive.set(officeInfo.pending > 0 ? o.col.waiting : 0x000000); o.lampMat.emissiveIntensity = officeInfo.pending > 0 ? 1.2 : 0
  if (hubA) {
    let f = hero.figs.get(hubA.sessionId)
    if (!f || !f.hub) { if (f) dropFigure(f); f = makeFigure(hubA.sessionId, true); hero.figs.set(hubA.sessionId, f) }
    if (!f.placed) { seatAt(f, o.hubDesk); f.placed = true }
    f.loc = 'hub'; f.state = sceneOf(hubA); nameTag(f, hubA.name || 'JARVIS')
  }
  const roomOf = a => Math.max(0, o.rooms.findIndex(r => r.key === a.lane))
  const used = new Set([...hero.figs.values()].filter(f => !f.hub && !f.boss && f.desk >= 0).map(f => f.desk))
  const rest = agents.filter(a => a !== hubA)
  const coordsIn = new Map()   // 방마다 Coordinator 수: 먼저 있던(오래 활동한) 쪽이 첫 책상
  const coordAgents = rest.filter(a => a.group === 'resident').sort((x, y) => (x.startedAt || 0) - (y.startedAt || 0))
  for (const a of coordAgents) {   // Coordinator: 방의 팀장 책상
    let f = hero.figs.get(a.sessionId)
    if (!f || f.hub) { if (f) dropFigure(f); f = makeFigure(a.sessionId, false); hero.figs.set(a.sessionId, f) }
    const r = roomOf(a), k = coordsIn.get(r) || 0, room = o.rooms[r]
    coordsIn.set(r, k + 1)
    const d = room.coords[Math.min(k, room.coords.length - 1)]
    if (f.desk !== d || !f.placed) { used.delete(f.desk); f.desk = d; used.add(d); if (f.spot) { f.spot.taken = null; f.spot = null } seatAt(f, o.desks[d]); f.loc = 'desk'; f.placed = true }
    f.coord = true; nameTag(f, (a.name || a.sessionId.slice(0, 8)) + (k > 0 ? ' · 중복' : ''))
    f.tag.classList.toggle('dup', k > 0); f.state = sceneOf(a)
  }
  for (const a of rest.filter(a => a.group !== 'resident')) {   // Worker: 그 방 작업 공간
    let f = hero.figs.get(a.sessionId), fresh = false
    if (!f || f.hub) { if (f) dropFigure(f); f = makeFigure(a.sessionId, false); hero.figs.set(a.sessionId, f); fresh = true }

    const s = sceneOf(a), was = f.state

  }
  for (const f of hero.figs.values()) f.ringMat.color.set(o.col[f.state] || o.col.rest)

}

// 서류: 사장 -> JARVIS(채팅), JARVIS -> Coordinator(배정), Coordinator -> Worker(지시), 그리고 반대 방향 보고·답.
// 페이지를 연 뒤 새로 생긴 것만 날린다
function anchorOf(name) {

function officeMessages() {
  const d = msgs24

  const top = Math.max(0, ...all.map(m => m.t || 0))
  if (hero.mark == null) { hero.mark = top; return }
  const fresh = all.filter(m => m.t > hero.mark && ['assign', 'report', 'chat', 'answer'].includes(m.kind)).sort((x, y) => x.t - y.t)
