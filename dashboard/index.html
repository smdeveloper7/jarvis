const lerpAngle = (a, b, k) => { const d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * k }
function officeStep(dt, t) {
  const o = hero.o, still = calm()
  let i = 0
  for (const f of hero.figs.values()) {
    i++
    const p = f.g.position
    if (f.path.length) {
      const target = f.path[0], dx = target.x - p.x, dz = target.z - p.z, dist = Math.hypot(dx, dz), step = 2.8 * dt
      if (dist <= step) { p.x = target.x; p.z = target.z; f.path.shift() }
      else { p.x += dx / dist * step; p.z += dz / dist * step; f.g.rotation.y = lerpAngle(f.g.rotation.y, Math.atan2(dx, dz), 0.25) }
      p.y = Math.abs(Math.sin(t * 11 + i)) * 0.07
    } else if (f.rest) { p.y += (f.rest.y - p.y) * 0.2; f.g.rotation.y = lerpAngle(f.g.rotation.y, f.rest.rot, 0.15) }
    const settled = !f.path.length, atDesk = settled && (f.loc === 'desk' || f.loc === 'hub')
    const working = atDesk && f.state === 'working' && !still
    f.body.rotation.z = working ? Math.sin(t * 3 + i) * 0.06 : 0
    f.head.position.y = 0.98 + (working ? Math.abs(Math.sin(t * 6 + i)) * 0.03 : 0)
    f.body.scale.y = settled && f.loc === 'lounge' && !still ? 1 + Math.sin(t * 1.7 + i) * 0.03 : 1
    f.ring.position.set(p.x, 0.02, p.z)
    const sp = f.sprite
    let map = null, y = 2.08
    if (settled) {
      if (f.state === 'waiting') { map = o.tex.bang; y += still ? 0 : Math.abs(Math.sin(t * 4)) * 0.18 }
      else if (f.state === 'working' && atDesk) map = o.tex.dots[still ? 0 : Math.floor(t * 3 + i) % 3]
      else if (f.state === 'rest' && (f.loc === 'lounge' || f.coord)) { map = o.tex.zzz; y += still ? 0 : (t * 0.6 + i * 0.3) % 1 * 0.25 }
    }
    sp.visible = !!map
    if (map && sp.material.map !== map) { sp.material.map = map; sp.material.needsUpdate = true }
    sp.position.set(p.x, p.y + y, p.z)
    const desk = f.boss ? o.bossDesk : f.hub ? o.hubDesk : o.desks[f.desk]
    if (desk) for (const scr of f.hub || f.boss ? desk.screens : desk.screens.slice(0, 1)) {
      if (f.state === 'working' && atDesk) { scr.emissive.set(o.col.working); scr.emissiveIntensity = 0.35 + (still ? 0 : Math.sin(t * 6 + i) * 0.08) }
      else if (f.state === 'waiting') { scr.emissive.set(o.col.waiting); scr.emissiveIntensity = still || Math.sin(t * 5) > 0 ? 0.85 : 0.25 }
      else { scr.emissive.setRGB(0, 0, 0); scr.emissiveIntensity = 0 }
    }
  }
  const hub = [...hero.figs.values()].find(f => f.hub)
  o.hubPulse = Math.max(0, (o.hubPulse || 0) - dt * 2)
  if (hub) hub.g.scale.setScalar(1 + o.hubPulse * 0.08)
  for (let k = o.packets.length - 1; k >= 0; k--) {
    const pk = o.packets[k]; pk.t += dt / pk.dur
    const e = Math.min(1, pk.t)
    pk.m.position.lerpVectors(pk.from, pk.to, e); pk.m.position.y += 2.6 * e * (1 - e) * 2
    pk.m.rotation.y += dt * 7; pk.m.rotation.z = Math.sin(e * Math.PI) * 0.4
    if (e >= 1) { o.scene.remove(pk.m); pk.m.geometry.dispose(); pk.m.material.dispose(); o.packets.splice(k, 1); hero.o.hubPulse = Math.max(hero.o.hubPulse, 0.6) }
  }
}

function officeRender() {
  const o = hero?.o
  if (!o || !hero.box.isConnected) return
  o.renderer.render(o.scene, o.camera)
  const w = hero.stage.clientWidth, hh = hero.stage.clientHeight
  for (const sg of o.signs || []) {
    o.v.copy(sg.pos).project(o.camera)
    if (!sg.w) sg.w = sg.el.offsetWidth || 60
    sg.el.style.transform = `translate(${((o.v.x + 1) / 2 * w - sg.w / 2).toFixed(1)}px, ${((1 - o.v.y) / 2 * hh - 9).toFixed(1)}px)`
  }
  const placed = [], figs = [...hero.figs.values()].map(f => {
    o.v.set(f.g.position.x, 0, f.g.position.z).project(o.camera)
    if (!f.tw) { f.tw = f.tag.offsetWidth || 80; f.th = f.tag.offsetHeight || 20 }
    return { f, x: (o.v.x + 1) / 2 * w, y: (1 - o.v.y) / 2 * hh + 10 }
  }).sort((a, b) => a.y - b.y)
  for (const p of figs) {
    const { f } = p, half = f.tw / 2
    for (let k = 0; k < 2; k++) {
      const hit = placed.find(q => Math.abs(q.x - p.x) < (q.half + half + 4) && Math.abs(q.y - p.y) < f.th + 2)
      if (!hit) break
      p.y = hit.y + f.th + 3
    }
    placed.push({ x: p.x, y: p.y, half })
    f.tag.style.transform = `translate(${(p.x - half).toFixed(1)}px, ${p.y.toFixed(1)}px)`
    f.tag.dataset.state = f.state || 'rest'
  }
}

function heroLoop() {
  if (!hero || !hero.ok || hero.raf) return
  const step = now => {
    hero.raf = 0
    if (!hero.box.isConnected || cur || page !== 'agents' || document.hidden) { hero.last = 0; return }
    const moving = !calm(), dt = hero.last ? Math.min(0.05, (now - hero.last) / 1000) : 0
    hero.last = moving ? now : 0
    try {
      officeStep(hero.paused ? 0 : dt, now / 1000)
      hero.o.controls.update(); officeRender()
    } catch (e) { hero.ok = false; hero.box.classList.add('flat'); return }
    if (moving) hero.raf = requestAnimationFrame(step)
  }
  hero.raf = requestAnimationFrame(step)
}

let stat = null, statShown = null

// tiny Markdown subset: headings, lists (nested by indent), tables, fenced code, quotes, rules, paragraphs;
// inline code, **bold**, [text](url). Builds DOM nodes only, never HTML strings.
function inline(s) {
  const out = [], re = /`([^`]+)`|\*\*(.+?)\*\*|\[([^\]]+)\]\(([^)\s]+)\)/g
  let last = 0, m
  while ((m = re.exec(s))) {
    out.push(s.slice(last, m.index)); last = re.lastIndex
    if (m[1] != null) out.push(h('code', {}, m[1]))
    else if (m[2] != null) out.push(h('strong', {}, inline(m[2])))
    else out.push(/^https?:\/\//.test(m[4]) ? h('a', { href: m[4], target: '_blank', rel: 'noopener noreferrer' }, m[3]) : h('span', { title: m[4] }, m[3]))
  }
  out.push(s.slice(last))
  return out
}
function cells(line) {   // split a table row on |, but not inside `code` or after a backslash
  const out = []; let cell = '', code = false
  line = line.trim().replace(/^\|/, '').replace(/\|$/, '')
  for (let i = 0; i < line.length; i++) {
    const c = line[i]
    if (c === '\\' && line[i + 1] === '|') { cell += '|'; i++ }
    else if (c === '`') { code = !code; cell += c }
    else if (c === '|' && !code) { out.push(cell.trim()); cell = '' }
    else cell += c

  return [...out, cell.trim()]
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n'), out = []
  const LI = /^(\s*)([-*+]|\d+\.)\s+(.*)/
  let i = 0
  while (i < lines.length) {
    const l = lines[i]; let m
    if (!l.trim()) { i++; continue }
    if (/^\s*```/.test(l)) {
      const buf = []
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) buf.push(lines[i])
      i++; out.push(h('pre', {}, h('code', {}, buf.join('\n')))); continue
    }
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { out.push(h('h' + m[1].length, {}, inline(m[2]))); i++; continue }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push(h('hr')); i++; continue }
    if (l.trim().startsWith('|') && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || '')) {
      const head = cells(l), rows = []
      for (i += 2; i < lines.length && lines[i].trim().startsWith('|'); i++) rows.push(cells(lines[i]))
      out.push(h('div', { class: 'tablewrap' }, h('table', {},
        h('thead', {}, h('tr', {}, head.map(c => h('th', {}, inline(c))))),
        h('tbody', {}, rows.map(r => h('tr', {}, head.map((_, k) => h('td', {}, inline(r[k] || '')))))))))
      continue
    }
    if (LI.test(l)) {
      const stack = []   // [{indent, list, li}]
      for (; i < lines.length && lines[i].trim(); i++) {
        const it = lines[i].match(LI)
        if (!it) { if (stack.length) stack.at(-1).li.append(' ', ...inline(lines[i].trim())); continue }
        const ind = it[1].replace(/\t/g, '    ').length
        while (stack.length > 1 && ind < stack.at(-1).indent) stack.pop()
        if (!stack.length || ind > stack.at(-1).indent) {
          const list = h(/\d/.test(it[2]) ? 'ol' : 'ul')
          if (stack.length) stack.at(-1).li.append(list); else out.push(list)
          stack.push({ indent: ind, list })
        }
        const li = h('li', {}, inline(it[3]))
        stack.at(-1).list.append(li); stack.at(-1).li = li
      }
      continue
    }
    if (l.startsWith('>')) {
      const buf = []
      for (; i < lines.length && lines[i].startsWith('>'); i++) buf.push(lines[i].replace(/^>\s?/, ''))
      out.push(h('blockquote', {}, inline(buf.join(' ')))); continue
    }
    const buf = [l.trim()]   // always take the first line, so an odd line like a lone '|x' cannot stall the loop
    for (i++; i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*```|\s*\|)/.test(lines[i]) && !LI.test(lines[i]); i++) buf.push(lines[i].trim())
    out.push(h('p', {}, inline(buf.join(' '))))
  }
  return out
}

const short = ms => clock(ms).replace(/:\d\d$/, '')
const nodeKey = n => n.listed ? status(n).key : 'closed'
const nodeTip = n => [n.name,
  n.group === 'resident' ? '상시 ' + (n.lane || '') : n.group === 'task' ? '일회성 ' + (n.task || '') : n.group === 'codex' ? 'codex' : '',
  n.listed ? status(n).label : '목록에 없음(닫힘)', `보냄 ${n.sent}, 받음 ${n.got}`].filter(x => x && x.trim()).join(', ')
const related = (m, sel) => !sel || (sel.node ? m.from === sel.node || m.to === sel.node : m.from === sel.edge[0] && m.to === sel.edge[1])
function select(sel) {
  const same = sel && flowSel && JSON.stringify(sel) === JSON.stringify(flowSel)
  flowSel = same ? null : sel
  renderFlowTab()
}

// the orbit: hub in the middle, the busiest RING sessions named on a ring around it, any others as small unnamed dots
// on an inner ring (name on hover or when picked). 입체 lays the rings on a tilted plane that a drag or the arrow keys
// turn, and each route arcs above it; 평면 looks straight down. Edges bend left of travel so the two directions part.
const RING = 16
let flowView = store.get('flowView', 'orbit') === 'flat' ? 'flat' : 'orbit'
const cam = { yaw: -0.5, pitch: 0.62 }
try { const c = store.get('flowCam', null); if (c && isFinite(c.yaw) && isFinite(c.pitch)) Object.assign(cam, { yaw: c.yaw, pitch: c.pitch }) } catch (e) {}
const PITCH = [0.45, 1.45]   // radians above the plane: flat on the edge to nearly straight down
let dragged = false   // a drag that turned the orbit is not a click
const unit = (p, q) => { const l = Math.hypot(q.x - p.x, q.y - p.y) || 1; return { x: (q.x - p.x) / l, y: (q.y - p.y) / l } }

function graphBox(f, W) {
  const H = Math.round(Math.min(500, Math.max(360, W * 0.7)))
  const load = n => n.sent + n.got
  const hub = f.nodes.find(n => n.name === f.hub) || [...f.nodes].sort((a, b) => load(b) - load(a))[0]
  const rest = f.nodes.filter(n => n !== hub)
    .sort((a, b) => (GROUP_RANK[a.group] ?? 9) - (GROUP_RANK[b.group] ?? 9) || load(b) - load(a) || a.name.localeCompare(b.name))
  const named = new Set([...rest].sort((a, b) => load(b) - load(a)).slice(0, RING).map(n => n.name))
  const outer = rest.filter(n => named.has(n.name)), inner = rest.filter(n => !named.has(n.name))
  const world = new Map([[hub.name, { x: 0, y: 0, r: 18 }]])   // the plane: outer ring radius 1
  outer.forEach((n, i) => {
    const a = -Math.PI / 2 + 2 * Math.PI * i / outer.length
    world.set(n.name, { x: Math.cos(a), y: Math.sin(a), r: 7 + Math.min(9, Math.sqrt(load(n)) * 1.3) })
  })
  inner.forEach((n, i) => {
    const a = -Math.PI / 2 + 2 * Math.PI * (i + 0.5) / inner.length
    world.set(n.name, { x: 0.58 * Math.cos(a), y: 0.58 * Math.sin(a), r: 4.5, dot: true })
  })
  const orbit = flowView === 'orbit', sel = flowSel
  const svg = sv('svg', {
    viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'group', tabindex: 0,
    'aria-label': '세션 사이 메시지 그래프' + (orbit ? '. 끌거나 화살표 키로 돌립니다' : ''),
    onclick: () => { if (!dragged && flowSel) select(null) }
  })

  function draw() {
    const yaw = orbit ? cam.yaw : 0, pitch = orbit ? cam.pitch : Math.PI / 2
    const cs = Math.cos(yaw), sn = Math.sin(yaw), sp = Math.sin(pitch), cp = Math.cos(pitch)
    // fit the tilted disc, its rising arcs and the front labels inside the box at any angle and width
    const R0 = Math.min(W / 2 - 84, H), V0 = Math.min(R0 * sp, H / 2 - 52), k1 = 0.19 * cp
    const up = 1.16 * V0 * (1 - k1) + 0.4 * R0 * cp, down = 1.16 * V0 * (1 + k1)
    const fit = Math.min(1, (H - 72) / (up + down)), Rx = R0 * fit, V = V0 * fit, lift = R0 * cp * fit
    const cx = W / 2, cy = 36 + up * fit + Math.max(0, (H - 72 - (up + down) * fit) / 2)
    const proj = (x, y, z = 0) => {
      const xr = x * cs - y * sn, yr = x * sn + y * cs, k = 1 + 0.16 * yr * cp   // nearer the viewer, a little larger
      return { x: cx + xr * Rx * k, y: cy + yr * V * k - z * lift * k, k, d: yr }
    }
    const pos = new Map([...world].map(([name, p]) => { const q = proj(p.x, p.y); return [name, Object.assign(q, { r: p.r * q.k, dot: p.dot })] }))
    const f1 = v => v.toFixed(1)
    const ring = r => 'M' + Array.from({ length: 73 }, (_, i) => { const a = i / 72 * 2 * Math.PI, q = proj(r * Math.cos(a), r * Math.sin(a)); return f1(q.x) + ',' + f1(q.y) }).join(' L')
    const ground = sv('g', { 'aria-hidden': 'true' },
      sv('path', { class: 'odisc', d: ring(1.16) + 'Z' }),
      [1, 0.58].map(r => sv('path', { class: 'oring', d: ring(r) })))   // the two orbits the sessions sit on
    const edges = f.edges.map(e => {
      const A = world.get(e.from), B = world.get(e.to), a = pos.get(e.from), b = pos.get(e.to)
      if (!A || !B || A === B) return null
      const len = Math.hypot(B.x - A.x, B.y - A.y) || 1, off = Math.min(0.2, len * 0.14)
      const Cp = { x: (A.x + B.x) / 2 + (B.y - A.y) / len * off, y: (A.y + B.y) / 2 - (B.x - A.x) / len * off, z: 0.1 + 0.3 * len }
      const pts = []
      for (let i = 0; i <= 32; i++) {
        const t = i / 32, u = 1 - t
        pts.push(proj(u * u * A.x + 2 * u * t * Cp.x + t * t * B.x, u * u * A.y + 2 * u * t * Cp.y + t * t * B.y, 2 * u * t * Cp.z))
      }
      const w = Math.min(7, 1.2 + 1.6 * Math.log2(e.count)) * (a.k + b.k) / 2, L = 6 + w, hw = 3.5 + w / 2
      const far = (p, c, r) => Math.hypot(p.x - c.x, p.y - c.y) >= r
      let i0 = 0; while (i0 < pts.length - 2 && !far(pts[i0], a, a.r + 2)) i0++
      let i1 = pts.length - 1; while (i1 > i0 + 1 && !far(pts[i1], b, b.r + 2)) i1--
      const tip = pts[i1]
      let i2 = i1; while (i2 > i0 && !far(pts[i2], tip, L)) i2--
      const base = pts[i2], u = unit(tip, base)
      const d = 'M' + pts.slice(i0, i2 + 1).map(p => f1(p.x) + ',' + f1(p.y)).join(' L')
      const head = [tip, { x: base.x - u.y * hw, y: base.y + u.x * hw }, { x: base.x + u.y * hw, y: base.y - u.x * hw }]
      const on = sel && (sel.edge ? sel.edge[0] === e.from && sel.edge[1] === e.to : e.from === sel.node || e.to === sel.node)
      return sv('g', {
        class: 'fe' + (on ? ' on' : sel ? ' dim' : ''),
        onclick(ev) { ev.stopPropagation(); if (!dragged) select({ edge: [e.from, e.to] }) }
      }, sv('title', {}, `보낸 쪽 ${e.from}, 받는 쪽 ${e.to}, ${e.count}건, 마지막 ${short(e.last)}`),
        sv('path', { class: 'fhit', d }), sv('path', { class: 'fedge', d, 'stroke-width': f1(w) }),
        sv('polygon', { class: 'farrow', points: head.map(p => f1(p.x) + ',' + f1(p.y)).join(' ') }))
    })
    const nodes = [hub, ...inner, ...outer].sort((m, n) => pos.get(m.name).d - pos.get(n.name).d).map(n => {   // far first
      // ~7.4 px per character: centred when it fits, else anchored to the nearer box edge, cut only past the box width
      const p = pos.get(n.name), wide = n.name.length * 7.4, centred = p.x - wide / 2 > 6 && p.x + wide / 2 < W - 6
      const anchor = centred ? 'middle' : p.x > W / 2 ? 'end' : 'start', tx = centred ? 0 : p.x > W / 2 ? Math.max(0, W - 6 - p.x) : Math.min(0, 6 - p.x)
      const fit = Math.max(6, Math.floor((W - 12) / 7.4))
      const on = sel && (sel.node ? sel.node === n.name : sel.edge.includes(n.name))
      const pick = () => { if (!dragged) select({ node: n.name }) }
      return sv('g', {
        class: `fnode ${nodeKey(n)} g-${n.group}${n === hub ? ' hub' : ''}${on ? ' on' : sel && !on ? ' dim' : ''}`,
        transform: `translate(${f1(p.x)},${f1(p.y)})`, tabindex: 0, role: 'button', 'aria-label': nodeTip(n), 'data-name': n.name,
        onclick(ev) { ev.stopPropagation(); pick() },
        onkeydown(ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); pick() } }
      }, sv('title', {}, nodeTip(n)), sv('circle', { r: f1(p.r) }),
        sv('text', { x: f1(tx), y: f1(p.r + 15), 'text-anchor': anchor, class: p.dot && !on ? 'hover' : null }, n.name.length > fit ? n.name.slice(0, fit - 1) + '…' : n.name))
    })
    const focused = svg.contains(document.activeElement) ? document.activeElement.getAttribute('data-name') : null
    put(svg, ground, edges, nodes)
    if (focused) [...svg.querySelectorAll('.fnode')].find(g => g.getAttribute('data-name') === focused)?.focus()
  }
  draw()

  const box = h('div', { class: 'graph' + (orbit ? ' orbit' : '') }, svg,
    orbit ? h('div', { class: 'ghelp', 'aria-hidden': 'true' }, '끌어서 돌리기') : null,
    inner.length ? h('div', { class: 'gnote' }, `건수가 많은 ${RING}개만 이름을 붙였습니다. 안쪽 점 ${inner.length}개는 올리거나 누르면 이름이 보입니다.`) : null)
  if (!orbit) return box
  let start = null, raf = 0
  const turn = (yaw, pitch) => {
    cam.yaw = yaw; cam.pitch = Math.min(PITCH[1], Math.max(PITCH[0], pitch))
    cancelAnimationFrame(raf); raf = requestAnimationFrame(draw)
  }
  svg.addEventListener('pointerdown', ev => { if (ev.button === 0) { start = { x: ev.clientX, y: ev.clientY, yaw: cam.yaw, pitch: cam.pitch }; dragged = false } })
  svg.addEventListener('pointermove', ev => {
    if (!start) return
    const dx = ev.clientX - start.x, dy = ev.clientY - start.y
    if (!dragged && Math.hypot(dx, dy) < 5) return
    if (!dragged) { dragged = true; box.classList.add('drag'); try { svg.setPointerCapture(ev.pointerId) } catch (e) {} }
    turn(start.yaw + dx * 0.008, start.pitch - dy * 0.006)
  })
  const end = () => {
    if (!start) return
    start = null; box.classList.remove('drag')
    if (dragged) { store.set('flowCam', cam); setTimeout(() => { dragged = false }, 0) }   // the click after a drag is swallowed
  }
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end)
  svg.addEventListener('keydown', ev => {
    const step = { ArrowLeft: [-0.2, 0], ArrowRight: [0.2, 0], ArrowUp: [0, 0.12], ArrowDown: [0, -0.12] }[ev.key]
    if (!step) return
    ev.preventDefault(); turn(cam.yaw + step[0], cam.pitch + step[1]); store.set('flowCam', cam)
  })
  return box
}

function msgEl(m) {
  const open = openMsgs.has(m.id)
  return h('article', { class: 'fmsg' },
    h('div', { class: 'r1' }, h('span', { class: 'kb ' + m.kind }, KIND_LABEL[m.kind] || '기타'),
      h('b', {}, m.from), h('span', { class: 'arrow' }, icon('to', '에서 받는 쪽')), h('b', {}, m.to),
      h('time', { title: clock(m.t) + (m.src === 'recv' ? ', 받은 쪽 기록' : '') }, short(m.t))),
    h('div', { class: 'fsum' }, m.sum || '(내용 없음)'),
    h('button', {
      class: 'more', 'aria-expanded': String(open),
      onclick() { open ? openMsgs.delete(m.id) : openMsgs.add(m.id); renderFlowTab() }
    }, open ? '본문 접기' : '본문 펼치기'),
    open ? h('div', { class: 'txt' }, m.text) : null)
}

function renderFlowTab() {
  const scroll = view.querySelector('.scroll.flow') || h('div', { class: 'scroll flow' })
  if (!scroll.isConnected) put(view, scroll)
  const f = flow, sel = flowSel
  const list = f?.messages ? f.messages.filter(m => related(m, sel)) : []
  const seg = h('div', { class: 'seg flat', role: 'group', 'aria-label': '시간 범위' }, WINDOWS.map(([hrs, label]) => h('button', {
    class: 'segb', 'aria-pressed': String(flowHours === hrs),
    onclick() {
      if (flowHours === hrs) return
      flowHours = hrs; flow = null; flowKey = ''
      try { localStorage.setItem('flowHours', String(hrs)) } catch (e) {}
      renderFlowTab(); pollMessages()
    }
  }, label)))
  const viewSeg = h('div', { class: 'seg flat vseg', role: 'group', 'aria-label': '그래프 보기' }, [['orbit', '입체'], ['flat', '평면']].map(([v, label]) => h('button', {
    class: 'segb', 'aria-pressed': String(flowView === v),
    onclick() { if (flowView !== v) { flowView = v; store.set('flowView', v); renderFlowTab() } }
  }, label)))
  // a graph that fails in 3D falls back to the flat drawing, and a flat failure leaves the list below it intact
  const graph = () => {
    const W = scroll.clientWidth - 34
    try { return graphBox(f, W) } catch (e) {}
    try { flowView = 'flat'; return graphBox(f, W) } catch (e) { return h('div', { class: 'banner' }, '그래프를 그리지 못했습니다: ' + e.message) }
  }
  put(scroll,
    h('div', { class: 'fhead' }, seg, f?.nodes ? h('span', { class: 'hint' }, `메시지 ${f.total}건, 세션 ${f.nodes.length}개`) : null, f?.total ? viewSeg : null),
    !f ? h('div', { class: 'empty' }, '불러오는 중…')
      : f.error ? h('div', { class: 'banner' }, '메시지를 읽지 못했습니다: ' + f.error)
      : !f.total ? h('div', { class: 'empty' }, '이 시간 안에 세션끼리 주고받은 메시지가 없습니다.')
      : [graph(),
        sel ? h('div', { class: 'fsel' },
          sel.node ? [h('b', {}, sel.node), ' 이 보내거나 받은 메시지'] : ['보낸 쪽 ', h('b', {}, sel.edge[0]), ', 받는 쪽 ', h('b', {}, sel.edge[1]), ' 메시지'],
          h('button', { onclick: () => select(null) }, '전체 보기')) : null,
        put(tokBox, tokenBars()) || tokBox,
        h('section', { class: 'sec' },
          h('div', { class: 'sec-h' }, h('h2', {}, '메시지'), h('span', { class: 'num' }, list.length),
            f.total > f.messages.length ? h('span', { class: 'hint' }, `최근 ${f.messages.length}건만 목록에 보입니다`) : null),
          list.length ? list.map(msgEl) : h('div', { class: 'sec-empty' }, '없음'))])
}

let tokAll = false
const TOK_TOP = 5   // bars shown before 더 보기, so the message list stays near the graph
const tokBox = h('div')   // redrawn on its own when the agent list refreshes
function tokenBars() {
  const rows = withTokens()
  if (!rows.length) return null
  const max = rows[0].tokens.total || 1, dup = n => rows.filter(a => a.name === n).length > 1
  const shown = tokAll ? rows : rows.slice(0, TOK_TOP)
  return h('section', { class: 'sec' },
    h('div', { class: 'sec-h' }, h('h2', {}, '세션별 처리 토큰'), h('span', { class: 'num' }, rows.length)),
    h('div', { class: 'tleg' }, h('span', { class: 'def' }, TOK_DEF + '. Claude 는 서브에이전트 기록까지 더합니다.'),
      h('span', { class: 'claude' }, 'Claude'), h('span', { class: 'codex' }, 'codex')),
    h('div', { class: 'toks' }, shown.map(a => h('div', { class: 'tok ' + a.tokens.engine, title: tokTip(a.tokens) },
      h('span', { class: 'tn' }, a.name || a.sessionId.slice(0, 8), dup(a.name) ? h('small', {}, a.sessionId.slice(0, 8)) : null),
      h('span', { class: 'tb', 'aria-hidden': 'true' }, h('i', { style: `width:${(100 * a.tokens.total / max).toFixed(2)}%` })),
      h('b', { class: 'num' }, tok(a.tokens.total))))),
    rows.length > TOK_TOP ? h('button', { class: 'more', onclick() { tokAll = !tokAll; put(tokBox, tokenBars()) } }, tokAll ? '접기' : `${rows.length - TOK_TOP}개 더 보기`) : null)
}

// every 5 s on the flow tab; elsewhere every 15 s, only for the report count and alerts
let msgAt = 0
async function pollMessages() {
  const onFlow = !cur && page === 'flow' && !document.hidden
  if (!onFlow && Date.now() - msgAt < 15000) return
  const hours = onFlow ? flowHours : 24
  msgAt = Date.now()
  try {
    const r = await fetch('/api/messages?hours=' + hours)
    const text = await r.text()
    if (!r.ok) throw new Error(r.status)
    if (text === flowKey) return   // nothing new
    const d = JSON.parse(text)
    checkReports(d)
    if (hours === 24) {
      msgs24 = d
      if (!cur && page === 'agents' && agentView === 'canvas') view.querySelector('.canvas')?.drawLinks?.()
      if (hero?.ok) try { officeMessages() } catch (e) {}   // a sheet per new [배정] or [보고]
    }
    if (hours !== flowHours) return   // a background read, or the window changed meanwhile
    flowKey = text; flow = d
  } catch (err) { if (!flow && onFlow) flow = { error: err.message } }
  if (!cur && page === 'flow') renderFlowTab()
}

/* ---------- detail ---------- */
function copyRow(cmd) {
  const code = h('code', {}, cmd)
  const btn = h('button', {
    async onclick() {
      try { await navigator.clipboard.writeText(cmd); btn.textContent = '복사됨' }
      catch (e) {
        const r = document.createRange(); r.selectNodeContents(code)
        getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = 'Ctrl+C'
      }
      setTimeout(() => { btn.textContent = '복사' }, 1500)
    }
  }, '복사')
  return h('div', { class: 'cmd' }, code, btn)
}

function renderDetailHead() {
  const a = cur.agent
  const head = cur.head
  if (!a) {
    put(head, h('div', { class: 'dtitle' }, h('h2', {}, cur.sid.slice(0, 8))),
      h('div', { class: 'hint' }, '지금 목록에 없는 세션입니다. 이미 끝났을 수 있습니다.'))
    return
  }
  const s = status(a), bg = a.kind === 'background', codex = a.engine === 'codex'
  head.className = 'dhead ' + s.key
  put(head, 
    h('div', { class: 'dtitle' }, h('h2', {}, a.name || a.sessionId.slice(0, 8)), badge(a), stateEl(s)),
    h('div', { class: 'dcwd' }, home(a.cwd)),
    a.detail ? h('div', { class: 'why' }, a.detail) : null,
    s.key === 'blocked' && a.needs ? h('div', { class: 'needs' }, a.needs) : null,
    h('div', { class: 'meta' },
      h('span', {}, kindLabel(a)),
      a.id ? h('span', {}, 'id ', h('b', {}, a.id)) : null,
      h('span', {}, 'pid ', h('b', {}, a.pid)),
      h('span', {}, '시작 ', h('b', {}, ago(a.startedAt))),
      h('span', {}, '활동 ', h('b', {}, ago(a.lastActivity)), hm(a.lastActivity))),
    codex ? h('div', { class: 'cmds' }, h('div', { class: 'hint' },
      'Codex 세션은 대화 기록만 봅니다. 상태는 codex 프로세스가 기록 파일을 열고 있는지와 마지막 턴이 끝났는지로 정합니다.'))
    : h('div', { class: 'cmds' },
      bg ? copyRow('claude attach ' + a.id) : copyRow(`cd ${a.cwd} && claude --resume ${a.sessionId} --fork-session`),
      bg ? null : h('div', { class: 'hint' }, '대화형 세션은 붙는 명령이 없습니다. 위 명령은 이 기록을 새 세션 id 로 복사해 새 창에서 엽니다. 원래 세션의 기록에는 쓰지 않습니다.')),
    (a.subagents || []).length ? h('div', { class: 'subs dsubs' }, h('div', { class: 'subs-t' }, '서브에이전트 ', h('b', {}, a.subagents.length + '개')), subList(a)) : null,
    h('div', { class: 'tabs', role: 'tablist' },
      h('button', { class: 'tab', role: 'tab', 'aria-selected': String(cur.tab === 'chat'), onclick: () => { location.hash = '#/s/' + cur.sid } }, '대화'),
      h('button', {
        class: 'tab', role: 'tab', 'aria-selected': String(cur.tab === 'logs'), disabled: !bg,
        title: bg ? null : codex ? 'Codex 세션은 터미널 출력을 볼 수 없습니다' : '대화형 세션은 터미널 출력을 볼 수 없습니다',
        onclick: () => { location.hash = '#/s/' + cur.sid + '/logs' }
      }, '세션 창')))
}

function showDetail(sid, tab) {
  if (!cur || cur.sid !== sid) {
    cur = { sid, offset: -1, tools: new Map(), head: h('div', { class: 'dhead' }), feed: h('div', { class: 'scroll' }), pane: h('div', { class: 'scroll' }) }
  }
  cur.tab = tab
  cur.agent = agents.find(a => a.sessionId === sid)
  renderTop(); renderDetailHead()
  put(view, cur.head, tab === 'logs' ? cur.pane : cur.feed)
  if (tab === 'logs') pollLogs(); else pollTranscript()
}

function textBlock(text) {
  const t = h('div', { class: 'txt' }, text)
  if (text.length < 700 && text.split('\n').length <= 10) return t
  t.classList.add('clamp')
  const more = h('button', {
    class: 'more', onclick() { more.textContent = t.classList.toggle('clamp') ? '펼치기' : '접기' }
  }, '펼치기')
  return [t, more]
}

function eventEl(e) {
  const who = (label, ...rest) => h('div', { class: 'who' }, h('b', {}, label), ...rest, h('time', {}, clock(e.t)))
  switch (e.k) {
    case 'user': return h('div', { class: 'ev msg user' }, who('사용자'), textBlock(e.text))
    case 'reply': return h('div', { class: 'ev msg reply' }, who(cur.agent?.engine === 'codex' ? 'Codex' : 'Claude'), textBlock(e.text))
    case 'peer': return h('div', { class: 'ev msg peer' }, who(e.from, '에게서 받음'), textBlock(e.text))
    case 'send': return h('div', { class: 'ev msg send' }, who(e.to, '에게 보냄'),
      e.sum ? h('div', { class: 'sum' }, e.sum) : null, textBlock(e.text))
    case 'note': return h('div', { class: 'note' }, e.text, ' ', h('time', {}, clock(e.t)))
    case 'tool': {
      const mark = h('span', { class: 'mark', 'aria-label': '실행 중' }, '…')
      const body = h('div', { class: 'tbody', hidden: true }, h('pre', {}, e.text))
      const head = h('button', {
        class: 'thead', 'aria-expanded': 'false',
        onclick() { body.hidden = !body.hidden; head.setAttribute('aria-expanded', String(!body.hidden)) }
      }, mark, h('span', { class: 'tname' }, e.name), h('span', { class: 'tsum' }, e.sum), h('time', {}, clock(e.t).slice(-8)))
      cur.tools.set(e.id, { mark, body })
      return h('div', { class: 'ev tool' }, head, body)
    }
  }
}

function addResult(e) {
  const t = cur.tools.get(e.id)
  if (!t) return
  t.mark.textContent = e.err ? '✕' : '✓'
  t.mark.className = 'mark ' + (e.err ? 'err' : 'ok')
  t.mark.setAttribute('aria-label', e.err ? '실패' : '완료')
  t.body.append(h('pre', { class: e.err ? 'err' : '' }, e.text || '(출력 없음)'))
}

async function pollTranscript() {
  const c = cur
  if (!c || c.tab !== 'chat' || c.loading) return
  c.loading = true
  try {
    const r = await getJSON(`/api/transcript?sid=${encodeURIComponent(c.sid)}&from=${c.offset}`)
    if (cur !== c) return
    const feed = c.feed
    const follow = c.offset < 0 || feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120
    if (r.reset) {
      c.tools.clear()
      put(feed, r.missing ? h('div', { class: 'empty' }, '이 세션은 아직 기록 파일이 없습니다. 첫 대화가 오가면 여기에 나옵니다.') : null,
        r.truncated ? h('div', { class: 'note-top' }, `최근 ${r.events.length}건만 보여 줍니다.`) : null)
    }
    for (const e of r.events) e.k === 'result' ? addResult(e) : feed.append(eventEl(e))
    c.offset = r.offset
    if (follow && r.events.length) feed.scrollTop = feed.scrollHeight
  } catch (err) {
    if (c.offset < 0) put(c.feed, h('div', { class: 'banner' }, '기록을 읽지 못했습니다: ' + err.message))
  } finally { c.loading = false }
}

/* ---------- session window (claude logs) ---------- */
// xterm takes hex or rgb; the tokens are oklch, so a 1px canvas resolves them
function tokenRGB(name) {
  const g = document.createElement('canvas').getContext('2d')
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue(name).trim() || 'black'
  g.fillRect(0, 0, 1, 1)
  const [r, gr, b] = g.getImageData(0, 0, 1, 1).data
  return '#' + [r, gr, b].map(x => x.toString(16).padStart(2, '0')).join('')
}
const COLS = 300   // wider than any daemon pty seen (~200), so nothing wraps; fitTerm crops to used width
function fitTerm(c) {
  const term = c.term, buf = term.buffer.active
  let used = 20
  for (let y = 0; y < buf.length; y++) {
    const line = buf.getLine(y)
    for (let x = term.cols - 1; x >= used; x--) if (line.getCell(x)?.getChars().trim()) { used = x + 1; break }
  }
  const screen = c.box.querySelector('.xterm-screen')
  const cellW = screen.offsetWidth / term.cols
  if (!cellW) return
  const avail = c.box.parentElement.clientWidth - 20
  const fs = Math.max(7, Math.min(13, Math.floor(term.options.fontSize * avail / (used * cellW) * 2) / 2))
  if (fs !== term.options.fontSize) term.options.fontSize = fs
  requestAnimationFrame(() => { c.box.style.width = Math.ceil(used * screen.offsetWidth / term.cols) + 'px' })
}

// portrait friendly view: the terminal is parsed at full width, then its rows are re-flowed as wrapping text
let logMode = 'flow'
try { logMode = localStorage.getItem('logMode') === 'raw' ? 'raw' : 'flow' } catch (e) {}
const RULE = /^[\s\u2500-\u257f]+$/   // box drawing rows
function flowRows(term) {
  const buf = term.buffer.active, rows = []
  for (let y = 0; y < buf.length; y++) rows.push((buf.getLine(y)?.translateToString(true) || '').replace(/\s+$/, ''))
  while (rows.length && !rows.at(-1)) rows.pop()
  const out = []
  for (const l of rows) {
    if (!l) { if (out.length && out.at(-1) !== '') out.push(''); continue }
    out.push(l)
  }
  return out
}
function renderFlow(c) {
  const pane = c.pane, follow = !c.flowShown || pane.scrollHeight - pane.scrollTop - pane.clientHeight < 120
  put(c.flowEl, flowRows(c.term).map(l => {
    if (!l) return h('div', { class: 'll gap' })
    if (RULE.test(l)) return h('div', { class: 'll sep' })
    const k = l.trimStart()[0]
    return h('div', { class: 'll' + (k === '\u25cf' ? ' bul' : k === '\u23bf' ? ' res' : k === '\u276f' ? ' prm' : '') }, l)
  }))
  c.flowShown = true
  if (follow) pane.scrollTop = pane.scrollHeight
}
function applyLogMode(c) {
  const flow = logMode === 'flow'
  c.flowEl.hidden = !flow
  c.rawWrap.classList.toggle('off', flow)
  for (const [m, btn] of Object.entries(c.modeBtns)) btn.setAttribute('aria-pressed', String(m === logMode))
  c.note.textContent = flow
    ? 'claude logs 출력을 3초마다 다시 그립니다. 화면 폭에 맞춰 줄바꿈한 글만 보여 주며 색과 배치는 원본 화면에서 볼 수 있습니다.'
    : 'claude logs 출력을 3초마다 다시 그립니다. 출력이 화면 중간부터 남아 있으면 위쪽이 비어 보일 수 있습니다.'
  if (!flow) requestAnimationFrame(() => fitTerm(c))
}

async function pollLogs() {
  const c = cur
  if (!c || c.tab !== 'logs' || !c.agent?.id || c.loadingLogs || document.hidden) return
  c.loadingLogs = true
  try {
    const r = await fetch('/api/logs?id=' + encodeURIComponent(c.agent.id))
    const text = await r.text()
    if (cur !== c || text === c.logText) return
    c.logText = text
    // The TUI paints with absolute rows (CSI row;col H); the largest row is the screen height.
    let rows = 24
    for (const m of text.matchAll(/\x1b\[(\d+);\d+H/g)) rows = Math.max(rows, +m[1])
    if (!c.term) {
      c.box = h('div', { class: 'term' })
      c.rawWrap = h('div', { class: 'termwrap' }, c.box)
      c.flowEl = h('div', { class: 'logflow' })
      c.note = h('p', { class: 'pane-note' })
      c.modeBtns = {}
      const mk = (m, label) => (c.modeBtns[m] = h('button', {
        class: 'segb', onclick() { logMode = m; try { localStorage.setItem('logMode', m) } catch (e) {} applyLogMode(c) }
      }, label))
      put(c.pane, h('div', { class: 'seg', role: 'group', 'aria-label': '세션 창 보기 방식' }, mk('flow', '세로 보기'), mk('raw', '원본 화면')),
        c.flowEl, c.rawWrap, c.note)
      c.term = new Terminal({
        cols: COLS, rows, fontSize: 10, scrollback: 0, disableStdin: true, cursorBlink: false,
        fontFamily: getComputedStyle(document.body).getPropertyValue('--font-outlier'),
        theme: { background: tokenRGB('--term-bg'), foreground: tokenRGB('--term-ink'), cursor: tokenRGB('--term-bg'), cursorAccent: tokenRGB('--term-bg') }
      })
      c.term.open(c.box)
      applyLogMode(c)
    } else if (c.term.rows !== rows) c.term.resize(COLS, rows)
    const first = !c.fitted
    c.term.reset()
    c.term.write(text + '\x1b[?25l', () => {
      fitTerm(c); c.fitted = true
      renderFlow(c)
      if (first) c.pane.scrollTop = c.pane.scrollHeight
    })
  } catch (err) {
    if (!c.term) put(c.pane, h('div', { class: 'banner' }, '세션 창을 읽지 못했습니다: ' + err.message))
  } finally { c.loadingLogs = false }
}

/* ---------- usage bar ---------- */
const usageBar = document.getElementById('usage')
const winName = w => ({ 300: '5시간', 10080: '주간' })[w.minutes] || (w.minutes ? (w.minutes % 60 ? w.minutes + '분' : w.minutes / 60 + '시간') : w.key)
const until = ms => { const t = span(2 * Date.now() - ms); return t === '방금' ? '곧' : t + ' 뒤' }   // span() counts back; mirror it
let usage = null

// a ring per window: the orange arc is what has been used; beside it the used share, then what is left and the reset a step fainter
const RC = 2 * Math.PI * 15
const ring = used => sv('svg', { class: 'ring', viewBox: '0 0 36 36', width: 30, height: 30, 'aria-hidden': 'true' },
  sv('circle', { class: 'rt', cx: 18, cy: 18, r: 15 }),
  used > 0 ? sv('circle', { class: 'rv', cx: 18, cy: 18, r: 15, 'stroke-dasharray': `${(used / 100 * RC).toFixed(1)} ${RC.toFixed(1)}`, transform: 'rotate(-90 18 18)' }) : null)
function renderUsage() {
  put(usageBar, [['claude', 'Claude'], ['codex', 'Codex']].map(([k, label]) => {
    const e = usage?.[k]
    if (!e) return null
    if (e.state === 'missing') return h('div', { class: 'use missing' }, h('span', { class: 'ul' }, label), h('span', { class: 'wn' }, '기록 없음'))
    if (e.state === 'broken') return h('div', { class: 'use broken', title: e.error }, h('span', { class: 'ul' }, label), h('span', { class: 'wn' }, '읽지 못함'))
    return h('div', { class: 'use ' + e.state, title: `기록 ${clock(e.at)}` + (e.plan ? `, ${e.plan}` : '') },
      h('span', { class: 'ul' }, label, h('span', { class: 'ago num' }, e.state === 'stale' ? '갱신 안 됨, ' + ago(e.at) : '갱신 ' + ago(e.at))),
      h('div', { class: 'wins' }, e.windows.map(w => {
        const used = Math.min(100, Math.max(0, Math.round(w.used))), left = 100 - used
        if (w.reset) return h('span', { class: 'win', title: '리셋 시각이 지나 남은 양을 모름' }, ring(0), h('span', { class: 'wt' }, h('b', {}, '리셋됨'), h('span', { class: 'wn' }, winName(w))))
        return h('span', { class: 'win', title: w.resets ? '리셋 ' + clock(w.resets) : null },
          ring(used),
          h('span', { class: 'wt' }, h('b', { class: 'num' }, used + '%'), h('span', { class: 'wn' }, `${winName(w)} 사용, 남은 ${left}%` + (w.resets ? ', ' + until(w.resets) : ''))))
      })))
  }), tokTotal())
}
// every listed session summed; the split by engine and the left out cache reads are in the tooltip
function tokTotal() {
  const rows = withTokens()
  if (!rows.length) return null
  const by = {}
  let read = 0
  for (const a of rows) { by[a.tokens.engine] = (by[a.tokens.engine] || 0) + a.tokens.total; read += a.tokens.cacheRead || 0 }
  const sum = Object.values(by).reduce((x, y) => x + y, 0)
  return h('div', { class: 'use', title: `${TOK_DEF}. 목록의 세션 ${rows.length}개 합. ` + Object.entries(by).map(([k, v]) => `${ENGINE[k] || k} ${tok(v)}`).join(', ') + `. 넣지 않은 캐시 읽기 ${tok(read)}` },
    h('span', { class: 'ul' }, '처리 토큰'),
    h('div', { class: 'wins' }, h('span', { class: 'win' }, h('span', { class: 'wt' }, h('b', { class: 'num' }, tok(sum)), h('span', { class: 'wn' }, `목록의 세션 ${rows.length}개 합계`)))))
}

async function pollUsage() {
  try { usage = await getJSON('/api/usage') } catch (err) {}   // keep the last reading; its age keeps growing
  renderUsage()
}

/* ---------- dev occupancy ---------- */
const devBar = document.getElementById('dev')
const DEV_KIND = { run: '', restart: '재기동 예정', deploy: '배포' }
let dev = null, devOpen = store.get('devOpen', false)
const elapsed = ms => !ms ? '' : ms > Date.now() ? until(ms) : span(ms) === '방금' ? '방금' : span(ms) + '째'
function devItem(i) {
  const kind = DEV_KIND[i.kind] ?? i.kind
  return h('div', {
    class: 'devi ' + (i.kind || ''),
    title: [kind || '실행', i.sinceAt ? '시작 ' + clock(i.sinceAt) : i.since, i.until ? '끝 ' + (i.untilAt ? clock(i.untilAt) : i.until) : '', i.note].filter(Boolean).join(', ')
  }, h('span', { class: 'dk' }, '공유 자원'), kind ? h('span', { class: 'kd' }, kind) : null, h('b', {}, i.who || '?'), h('span', { class: 'dw' }, i.what), h('span', { class: 'num' }, elapsed(i.sinceAt)))
}
// a missing or broken file hides the line; the reason stays in /api/dev and the hidden line's title
function renderDev() {
  const d = dev
  devBar.hidden = !d || d.state === 'missing' || d.state === 'broken'
  devBar.title = d?.error ? 'dev-occupancy.json: ' + d.error : ''
  if (!cur && page === 'status') renderStatus()   // the reason for a hidden line shows in the status header
  if (devBar.hidden) return put(devBar)
  const items = d.items, many = items.length > 1
  devBar.className = d.state
  put(devBar,
    h('div', { class: 'devl' }, items.length ? (devOpen ? items : items.slice(0, 1)).map(devItem) : h('div', { class: 'devi' }, h('span', { class: 'dk' }, '공유 자원'), '점유 없음')),
    many ? h('button', {
      class: 'more', 'aria-expanded': String(devOpen),
      onclick() { devOpen = !devOpen; store.set('devOpen', devOpen); renderDev() }
    }, devOpen ? '접기' : `${items.length}건 펼치기`) : null,
    d.state === 'stale' ? h('span', { class: 'ago', title: d.updatedAt ? '갱신 ' + clock(d.updatedAt) : 'updated_at 없음' }, d.updatedAt ? '갱신 ' + ago(d.updatedAt) : '갱신 시각 없음') : null)
}
async function pollDev() {
  try { dev = await getJSON('/api/dev') } catch (err) {}   // keep the last answer
  renderDev()
}

/* ---------- routing & polling ---------- */
function route() {
  const m = location.hash.match(/^#\/s\/([\w-]+)(\/logs)?/)
  if (m) return showDetail(m[1], m[2] ? 'logs' : 'chat')
  cur = null
  page = { '#/decisions': 'decisions', '#/status': 'status', '#/flow': 'flow', '#/todo': 'todo' }[location.hash] || 'agents'
  renderTop(); renderPage()
}
function renderPage() {
  if (page === 'decisions') renderDecisions()
  else if (page === 'status') { renderStatus(); pollStatus() }
  else if (page === 'flow') { renderFlowTab(); pollMessages() }
  else if (page === 'todo') renderTodo()
  else renderList()
}

async function pollAgents() {
  try { const r = await getJSON('/api/agents'); agents = r.agents; officeInfo = r.office || officeInfo; error = ''; checkBlocked(); renderUsage() }   // usage bar carries the token total
  catch (err) { error = err.message }
  if (cur) { cur.agent = agents.find(a => a.sessionId === cur.sid); renderTop(); renderDetailHead() }
  else { renderTop(); if (page === 'agents') renderList(); else if (page === 'flow') put(tokBox, tokenBars()) }
}

window.addEventListener('hashchange', route)
document.addEventListener('visibilitychange', () => { seen(); pollMessages(); heroLoop() })
window.addEventListener('resize', () => { if (cur?.term) fitTerm(cur); else if (!cur && page === 'flow' && flow) renderFlowTab() })
Promise.all([pollAgents(), pollDecisions(), pollTodo()]).then(() => { route(); pollMessages() })
pollUsage(); pollDev()
setInterval(pollAgents, 3000)
setInterval(pollDecisions, 3000)
setInterval(pollTodo, 3000)
setInterval(pollUsage, 3000)
setInterval(pollDev, 3000)
setInterval(pollStatus, 5000)
setInterval(pollMessages, 5000)
setInterval(pollTranscript, 2000)
setInterval(pollLogs, 3000)
</script>
</body>
</html>
